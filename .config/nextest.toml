# Cap the concurrency of tests that spawn the llmenv binary under a wall-clock
# budget (#1254).
#
# Every test in these binaries spawns the real `llmenv` binary and asserts it
# finishes inside a fixed timeout. The operation under test costs ~60ms; the
# rest of the measured time is process spawn and paging of two large debug
# binaries. That overhead scales with whatever else is running, not with the
# work — under `cargo nextest run --workspace` (2500+ tests, 47 binaries) a
# bundle export that takes 3.7s with only its own binary running reached ~12s
# against its 30s budget on a 10-core machine, and CI runners are smaller.
#
# Capping the group keeps the measured time near the uncontended case, so the
# budgets stay what they were written to be — a detector for genuine hangs like
# #547 (DNS resolution) and #548 (backend crash) — instead of a race against the
# size of the rest of the suite. `shell_hook` and `hook_run_failsoft` use 10s
# budgets, tighter than `smoke_suite`'s, so they need this at least as much.
#
# Membership rule: a test binary belongs here if it asserts a timeout on a
# spawned llmenv process. Binaries that spawn llmenv without a timeout
# (`config_context`, `task_cli`, …) are not affected by contention this way and
# are deliberately left out.
[test-groups.cli-subprocess]
max-threads = 4

[[profile.default.overrides]]
filter = '''
    binary(smoke_suite)
    + binary(setup_smoke)
    + binary(shell_hook)
    + binary(hook_run_failsoft)
    + binary(statusline_smoke)
'''
test-group = 'cli-subprocess'

# nextest's default 100 ms leak window flags tests that only read or write files
# when the whole suite runs in parallel (#2343): under load, one test in a full
# run reports LEAK although it starts no subprocess. Even 500 ms flagged a test
# at 0.52 s under double load. A leaked handle never closes, so a longer window
# delays the verdict only for a test that really leaks; a clean test is unaffected.
[profile.default]
leak-timeout = "2s"

# A leaked handle is a bug, so CI fails on it instead of passing it silently.
# The table form needs nextest 0.9.95 or later.
[profile.ci]
inherits = "default"
leak-timeout = { period = "2s", result = "fail" }
