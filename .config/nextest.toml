# Cap the concurrency of the smoke suite (#1254).
#
# Every test in `tests/smoke_suite.rs` spawns the real `llmenv` binary and
# asserts it finishes inside a wall-clock budget (`SHORT_TIMEOUT_SECS` /
# `LONG_TIMEOUT_SECS`). The operation under test costs ~60ms; the rest of the
# measured time is process spawn and paging of two large debug binaries. That
# overhead scales with whatever else is running, not with the work — under
# `cargo nextest run --workspace` (2500+ tests, 47 binaries) the same test that
# takes 3.7s with only this binary running reached ~12s against its 30s budget
# on a 10-core machine, and CI runners are smaller.
#
# Capping the group keeps the measured time near the uncontended case, so the
# budgets stay what they were written to be — a detector for genuine hangs like
# #547 (DNS resolution) and #548 (backend crash) — instead of a race against
# the size of the rest of the suite.
[test-groups.smoke]
max-threads = 2

[[profile.default.overrides]]
filter = 'binary(smoke_suite)'
test-group = 'smoke'
