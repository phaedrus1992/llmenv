# cargo-mutants scope (#1233).
#
# Mutation testing answers the question coverage can't: a test that executes a
# branch but doesn't assert anything meaningful about it passes coverage and
# fails here.
#
# Deliberately not the whole workspace. A full sweep finds 3571 mutants and each
# one costs a rebuild plus a full test run (~150s measured), so an unscoped run
# is tens of hours and produces far more surviving mutants than anyone can
# triage in one pass. These three areas are the most consequential logic in the
# tree — config validate/merge, the merge stage, and the hook-run path — and
# come to 736 mutants. Widen this list once they're clean.
#
# `crates/*` mutants only appear with `--workspace`; the workflow passes it.
examine_globs = [
  "crates/llmenv-config/src/**",
  "src/merge/**",
  "src/hook_run/**",
]

# Equivalent mutants: each compares an elapsed time with a limit, and no test
# can observe the difference between `<` and `<=` at the exact boundary.
exclude_re = [
  "replace < with <= in waves",
  "replace > with >= in prune_orphan_locks",
  # A detached spawn with no in-process effect. Its command
  # (consolidation_run_command) and the decision to call it
  # (maybe_start_consolidation) are tested.
  "replace post_session_consolidation with \\(\\)",
  # Reads the user's config and calls ICM, so a unit test cannot run it. Its pieces
  # (store_once, the checkpoint settling in run_icm_store_with) are tested (#2396).
  "replace run_icm_store_inner -> anyhow::Result<\\(\\)> with Ok\\(\\(\\)\\)",
  # An empty list and a list of several entries differ only in a debug log line.
  "delete match arm \\[\\] in run_inner",
  # Returns no state dir under `cfg!(test)` on purpose, so that a unit test that spawns a
  # detached child never writes into the user's state dir. The production branch is one call.
  "replace spawner_state_dir",
  # The NotFound guards in the stop_dedupe load_last and clear_last only choose between a silent return
  # and a warning log line. The returned value is the same either way.
  "replace match guard e.kind\\(\\) == std::io::ErrorKind::NotFound with (true|false) in (load_last|clear_last)",
  "replace == with != in (load_last|clear_last)",
]
