[workspace]
members = [
    ".",
    "crates/llmenv-paths",
    "crates/llmenv-git",
    "crates/llmenv-config",
    "crates/llmenv-util",
]
resolver = "2"

[workspace.dependencies]
anyhow = "=1.0.104"
ipnet = "=2.12.2"
if-addrs = "=0.15.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
# Reads the [package] and [tool.*] tables of scanned Cargo.toml and pyproject.toml files for
# onboarding (#2785). No writer: onboarding never re-serializes a manifest.
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
thiserror = "=2.0.21"
tracing = "=0.1.44"
proptest = "=1.12.0"
pulldown-cmark = "=0.13.5"
tempfile = "=3.27.0"
globset = "=0.4.21"
walkdir = "=2.5.0"
sha2 = "=0.11.1"
anstyle = "=1.0.14"
url = "=2.5.8"
humantime = "=2.4.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "blocking"] }
# Hostname via the uname(2) syscall instead of spawning the `hostname` binary on
# every hook-run ("system" enables uname). "process" enables kill_process_group
# for #1165's consolidation-timeout group-kill: a direct syscall instead of
# fork+exec'ing `kill`, which narrows the already-small window in which a
# reaped pid could be recycled before the group-kill fires. rustix is already
# in the tree transitively. No unsafe.
rustix = { version = "=1.1.6", features = ["fs", "process", "system", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[package]
name = "llmenv"
version = "3.13.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Universal scope-aware environment for AI coding agents"
repository = "https://github.com/phaedrus1992/llmenv"
homepage = "https://phaedrus1992.github.io/llmenv/"
documentation = "https://phaedrus1992.github.io/llmenv/"
readme = "README.md"
keywords = ["ai", "agents", "cli", "config", "environment"]
categories = ["command-line-utilities", "development-tools", "config"]
# Keep the published crate lean: the docs site, design docs, CI config, and dev
# scripts are not needed to build or use llmenv. Tests and benches ship so the
# crate stays verifiable from a crates.io checkout.
exclude = ["/website", "/docs", "/.github", "/scripts", "/proptest-regressions", "/crates"]

[lints]
workspace = true

[dependencies]
llmenv-paths = { path = "crates/llmenv-paths", version = "3.13.0" }
llmenv-git = { path = "crates/llmenv-git", version = "3.13.0" }
llmenv-config = { path = "crates/llmenv-config", version = "3.13.0" }
llmenv-util = { path = "crates/llmenv-util", version = "3.13.0" }
clap = { version = "=4.6.7", features = ["derive"] }
clap_complete = "=4.6.11"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
walkdir = { workspace = true }
sha2 = { workspace = true }
hex = "=0.4.3"
humantime = { workspace = true }
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
anstyle = { workspace = true }
globset = { workspace = true }
schemars = "=1.2.3"
reqwest = { workspace = true }
url = { workspace = true }
ipnet = { workspace = true }
if-addrs = { workspace = true }
rustix = { workspace = true }
tempfile = "=3.27.0"
pulldown-cmark = { workspace = true }
dialoguer = "=0.12.0"

[features]
# Test seam for #3030. It lets a measurement point the keychain read and delete at a stub
# `security` binary through LLMENV_SECURITY_BIN. Never enable it in a release build.
keychain-stub = []

[dev-dependencies]
assert_cmd = "=2.2.2"
insta = { version = "=1.49.0", features = ["yaml"] }
predicates = "=3.1.4"
proptest = "=1.12.0"
criterion = { version = "=0.8.2", features = ["html_reports"] }
wiremock = "=0.6.5"
filetime = "=0.2.29"
regex = "=1.13.1"
# Enables llmenv-util's shared proptest generators (#1281) for this crate's
# own tests, without pulling proptest into llmenv-util's default (non-test)
# dependency graph.
llmenv-util = { path = "crates/llmenv-util", version = "3.13.0", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[[bench]]
name = "cli_benchmark"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }
