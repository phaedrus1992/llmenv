[workspace]
members = [
    ".",
    "crates/llmenv-paths",
    "crates/llmenv-git",
    "crates/llmenv-config",
    "crates/llmenv-util",
]
resolver = "2"

[workspace.dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
# Codex's config is TOML (#233). A hand-rolled emitter would have to quote
# table keys correctly, and MCP server names come from user config — a name
# containing a dot would silently become nested tables.
toml = "=1.1.4"
thiserror = "=2.0.20"
tracing = "=0.1.44"
proptest = "=1.11.0"
pulldown-cmark = "=0.13.4"
tempfile = "=3.27.0"
globset = "=0.4.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[package]
name = "llmenv"
version = "4.0.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Universal scope-aware environment for AI coding agents"
repository = "https://github.com/phaedrus1992/llmenv"
homepage = "https://phaedrus1992.github.io/llmenv/"
documentation = "https://phaedrus1992.github.io/llmenv/"
readme = "README.md"
keywords = ["ai", "agents", "cli", "config", "environment"]
categories = ["command-line-utilities", "development-tools", "config"]
# Keep the published crate lean: the docs site, design docs, CI config, and dev
# scripts are not needed to build or use llmenv. Tests and benches ship so the
# crate stays verifiable from a crates.io checkout.
exclude = ["/website", "/docs", "/.github", "/scripts", "/proptest-regressions", "/crates"]

[lints]
workspace = true

[dependencies]
llmenv-paths = { path = "crates/llmenv-paths", version = "4.0.0-alpha.1" }
llmenv-git = { path = "crates/llmenv-git", version = "4.0.0-alpha.1" }
llmenv-config = { path = "crates/llmenv-config", version = "4.0.0-alpha.1" }
llmenv-util = { path = "crates/llmenv-util", version = "4.0.0-alpha.1" }
clap = { version = "=4.6.6", features = ["derive"] }
clap_complete = "=4.6.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
toml = { workspace = true }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "signal"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
thiserror = "=2.0.20"
anyhow = "=1.0.104"
walkdir = "=2.5.0"
directories = "=6.0.0"
sha2 = "=0.11.0"
hex = "=0.4.3"
humantime = "=2.4.0"
jiff = { version = "=0.2.35", default-features = false, features = ["std"] }
anstyle = "=1.0.14"
glob = "=0.3.4"
globset = { workspace = true }
schemars = "=1.2.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "blocking"] }
url = "=2.5.8"
# Hostname via the uname(2) syscall instead of spawning the `hostname` binary on
# every hook-run ("system" enables uname). "process" enables kill_process_group
# for #1165's consolidation-timeout group-kill: a direct syscall instead of
# fork+exec'ing `kill`, which narrows the already-small window in which a
# reaped pid could be recycled before the group-kill fires. rustix is already
# in the tree transitively. No unsafe.
rustix = { version = "=1.1.4", features = ["fs", "process", "system"] }
tempfile = "=3.27.0"
pulldown-cmark = { workspace = true }
dialoguer = "=0.12.0"

[dev-dependencies]
assert_cmd = "=2.2.2"
insta = { version = "=1.48.0", features = ["yaml"] }
predicates = "=3.1.4"
proptest = "=1.11.0"
criterion = { version = "=0.8.2", features = ["html_reports"] }
wiremock = "=0.6.5"
filetime = "=0.2.29"
# Enables llmenv-util's shared proptest generators (#1281) for this crate's
# own tests, without pulling proptest into llmenv-util's default (non-test)
# dependency graph.
llmenv-util = { path = "crates/llmenv-util", version = "4.0.0-alpha.1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[[bench]]
name = "cli_benchmark"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }
