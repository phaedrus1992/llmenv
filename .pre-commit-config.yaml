# Local git hooks for llmenv, managed by prek (https://github.com/j178/prek).
# Install after cloning:  prek install --hook-type pre-commit --hook-type pre-push
#
# fmt on commit (fast); clippy on push (fast on incremental builds).
# Tests and cargo-deny run in CI only (slow full rebuild).
#
# cargo-hawk (pre-push, #923) requires a one-time install matching the pinned
# toolchain exactly (see rust-toolchain.toml), with the rust-src/rustc-dev/
# llvm-tools-preview components hawk's own build needs:
#   rustup component add rust-src rustc-dev llvm-tools-preview
#   RUSTC_BOOTSTRAP=1 cargo install --locked cargo-hawk@0.1.12
# Or install a prebuilt release instead (no components/RUSTC_BOOTSTRAP
# needed) — see https://github.com/astral-sh/hawk#installation.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: markdownlint
        name: markdownlint
        entry: markdownlint-cli2
        language: system
        types: [markdown]
        stages: [pre-commit]
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cargo clippy --all-features --tests --jobs "$(scripts/core_count.sh)" -- -D warnings'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: changelog-sync
        name: changelog sync check
        entry: bash -c 'scripts/sync-changelog-doc.sh 2>/dev/null; git diff --exit-code website/docs/changelog.md'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-hawk
        name: cargo hawk check (warn-only, #923)
        # -W warnings (not -D): 330 pre-existing findings as of #923, not yet
        # cleaned up. Exits 0 regardless of findings at this level — only -D
        # findings or a genuine tool error fail the run. Ratchets to -D once
        # that cleanup lands — see #1314.
        entry: cargo hawk check -W warnings
        language: system
        pass_filenames: false
        stages: [pre-push]
