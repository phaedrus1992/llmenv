[package]
name = "llmenv-scope"
version = "5.0.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Scope detection and matching for llmenv"
repository = "https://github.com/phaedrus1992/llmenv"

[lints]
workspace = true

[dependencies]
llmenv-config = { path = "../llmenv-config", version = "5.0.0-alpha.1" }
serde = { workspace = true }
serde_yaml = { workspace = true }
globset = { workspace = true }
walkdir = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
# uname(2) for hostname detection — same reasoning as the main crate's own
# use of rustix for this (see src/scope/matcher.rs's original comment).
# The workspace-level feature set (fs, process, system) is broader than this
# crate needs (system only), but rustix is already a shared dependency across
# the workspace, so there's no separate build cost to inheriting the rest.
rustix = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
