[package]
name = "llmenv-paths"
version = "3.13.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Path resolution utilities for llmenv"
repository = "https://github.com/phaedrus1992/llmenv"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }

# `O_NOFOLLOW` has a different value on each Unix, so the unix target enables the `fs` feature.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
