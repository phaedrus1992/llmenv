[package]
name = "llmenv-mcp"
version = "5.0.0-alpha.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "MCP server resolution and proxy lifecycle for llmenv"
repository = "https://github.com/phaedrus1992/llmenv"

[lints]
workspace = true

[dependencies]
llmenv-config = { path = "../llmenv-config", version = "5.0.0-alpha.1" }
llmenv-paths = { path = "../llmenv-paths", version = "5.0.0-alpha.1" }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
wiremock = "=0.6.5"
# Enables the shared `port_guard()` cross-process test lock (#1610) — see
# llmenv-util's `test-util` feature doc comment.
llmenv-util = { path = "../llmenv-util", version = "5.0.0-alpha.1", features = [
    "test-util",
] }

[features]
# Exposes `McpHttpClient::test_new` to other workspace crates' dev-dependencies
# (mirrors llmenv-util's `test-util` feature, #1281) — `#[cfg(test)]` alone
# only compiles within this crate's own test target, so a downstream crate's
# tests never see it without this escape hatch.
test-util = []
