name: ci
on:
  pull_request:
permissions:
  contents: read
env:
  # Serialize rustup's component writes; parallel installs trip the runner's
  # virtualized disk (os error 5, #553). Inert for steps that don't call rustup.
  RUSTUP_IO_THREADS: "1"
jobs:
  # test/deny/hawk are required status checks (repo ruleset). A workflow-level
  # `paths:` filter would make GitHub report no status at all for a PR that
  # doesn't touch these paths, leaving the required check "Pending" forever
  # and blocking merge permanently — GitHub only treats a job-level `if:` skip
  # as a passing "Success", not a workflow that never triggered. So this job
  # always runs and each downstream job gates itself via `needs`/`if` instead.
  # Already fixed this way on release/4.x/main (28f225ae); backported here
  # because it was never applied to this branch's copy (#1596).
  #
  # `test` must NOT use a matrix (#1536): the repo ruleset's required status
  # check is named literally "test", but a matrixed job always reports under
  # the expanded name ("test (ubuntu-latest)") -- a single-value matrix here
  # was never buying anything (only ubuntu-latest ever ran) and left the
  # required check permanently "pending", blocking every PR from merging.
  # Already fixed this way on release/4.x/main; backported here because it
  # was never applied to this branch's copy.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'crates/**'
              - 'tests/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'hawk.toml'
              - 'CHANGELOG-*.md'
              - 'website/docs/changelog.md'
              - '.github/workflows/ci.yml'
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Cache the rustup toolchain itself — Swatinem/rust-cache below only
      # covers ~/.cargo and target/. A hit lets rustup skip the component
      # download that intermittently fails on macos runners with
      # "Input/output error (os error 5)" (#553). Must run before the
      # toolchain step so a restored toolchain short-circuits the install.
      # Split restore/save (instead of the combined action) and gate the
      # save on the verify step below: the combined action's save runs
      # unconditionally during job cleanup even if a later step fails, which
      # would let a toolchain corrupted by that same os-error-5 permanently
      # poison the cache under this key.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: rustup-cache
        with:
          path: &rustup-cache-path |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          # Keep toolchain + components in the key in sync with the step below.
          key: &rustup-cache-key rustup-ubuntu-latest-${{ hashFiles('rust-toolchain.toml') }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: rustc --version && cargo fmt --version && cargo clippy --version
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.rustup-cache.outputs.cache-hit != 'true'
        with:
          path: *rustup-cache-path
          key: *rustup-cache-key
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e  # v2
        with:
          tool: cargo-nextest
      - name: Detect CPU count
        run: echo "CARGO_BUILD_JOBS=$(scripts/core_count.sh)" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --test-threads "$CARGO_BUILD_JOBS"
  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          command: check
  hawk:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # id: toolchain -- rust-toolchain.toml pins channel = "stable" for the
      # rest of the repo, but doesn't declare the rust-src/rustc-dev/
      # llvm-tools-preview components hawk needs, so this step installs its
      # own toolchain instance with them and later steps force
      # RUSTUP_TOOLCHAIN to it via the `name` output (not a second hardcoded
      # literal) so the two can't drift apart.
      #
      # `toolchain: stable` here (not an exact version) is deliberate (#1584):
      # cargo-hawk links rustc_private internals that aren't semver-stable
      # across Rust releases, and each cargo-hawk release is built against
      # whatever Rust version was current stable when its maintainers cut it.
      # Pinning this toolchain to an exact version while the cargo-hawk
      # install below tracks latest (or vice versa) reintroduces exactly the
      # frozen-pin-vs-moving-tool mismatch #1584 fixed -- both must float
      # together so a Rust release and hawk's next release stay in lockstep.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        id: toolchain
        with:
          toolchain: stable
          components: rust-src, rustc-dev, llvm-tools-preview
      # Hawk uses rustc_private and must build against the exact toolchain
      # above (with rust-src/rustc-dev/llvm-tools-preview, per its install
      # docs); RUSTC_BOOTSTRAP=1 is required because `cargo install` ignores
      # this repo's cargo config (#923). No `@version` pin on cargo-hawk
      # itself (#1584) -- see the toolchain step's comment above for why.
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389  # v3.0.8
        env:
          RUSTC_BOOTSTRAP: "1"
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        with:
          tool: cargo-hawk
      # -D since #1314 cleared the 330-finding backlog from #923. The published
      # `crates/*` libs are excluded as external boundaries by the script.
      - run: bash scripts/hawk-check.sh -D warnings
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
