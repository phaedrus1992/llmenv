name: ci
on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'hawk.toml'
      - 'CHANGELOG-*.md'
      - 'website/docs/changelog.md'
      - '.github/workflows/ci.yml'
permissions:
  contents: read
env:
  # Serialize rustup's component writes; parallel installs trip the runner's
  # virtualized disk (os error 5, #553). Inert for steps that don't call rustup.
  RUSTUP_IO_THREADS: "1"
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Cache the rustup toolchain itself — Swatinem/rust-cache below only
      # covers ~/.cargo and target/. A hit lets rustup skip the component
      # download that intermittently fails on macos runners with
      # "Input/output error (os error 5)" (#553). Must run before the
      # toolchain step so a restored toolchain short-circuits the install.
      # Split restore/save (instead of the combined action) and gate the
      # save on the verify step below: the combined action's save runs
      # unconditionally during job cleanup even if a later step fails, which
      # would let a toolchain corrupted by that same os-error-5 permanently
      # poison the cache under this key.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: rustup-cache
        with:
          path: &rustup-cache-path |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          # Keep toolchain + components in the key in sync with the step below.
          key: &rustup-cache-key rustup-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: 1.97
          components: rustfmt, clippy
      - run: rustc --version && cargo fmt --version && cargo clippy --version
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: steps.rustup-cache.outputs.cache-hit != 'true'
        with:
          path: *rustup-cache-path
          key: *rustup-cache-key
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e  # v2
        with:
          tool: cargo-nextest
      - name: Detect CPU count
        run: echo "CARGO_BUILD_JOBS=$(scripts/core_count.sh)" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --test-threads "$CARGO_BUILD_JOBS"
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          command: check
  hawk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # id: toolchain -- rust-toolchain.toml pins channel = "stable" for the
      # rest of the repo; rustup resolves that toolchain file for every
      # cargo/rustc invocation in this checkout regardless of `rustup default`
      # (set below), so later steps must force RUSTUP_TOOLCHAIN to this exact
      # version via the `name` output, not a second hardcoded literal -- a
      # duplicated "1.97" here previously went stale the moment Renovate
      # bumped the `toolchain:` input below without knowing to touch a second
      # copy, which built hawk against a toolchain missing rustc-dev/rust-src/
      # llvm-tools and failed with E0463 on every rustc_private crate (#923).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        id: toolchain
        with:
          toolchain: 1.97
          components: rust-src, rustc-dev, llvm-tools-preview
      # Hawk uses rustc_private and must build against the exact toolchain
      # above (with rust-src/rustc-dev/llvm-tools-preview, per its install docs);
      # RUSTC_BOOTSTRAP=1 is required because `cargo install` ignores this
      # repo's cargo config (#923).
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389  # v3.0.8
        env:
          RUSTC_BOOTSTRAP: "1"
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
        with:
          tool: cargo-hawk@0.1.12
      # -D since #1314 cleared the 330-finding backlog from #923. The published
      # `crates/*` libs are excluded as external boundaries by the script.
      - run: bash scripts/hawk-check.sh -D warnings
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
