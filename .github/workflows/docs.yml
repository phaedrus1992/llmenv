name: docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/docs.yml'
  # No `paths:` filter: a PR that never triggers this workflow reports no
  # status, so docs-build could not be a required check (#3132). The build runs
  # on every PR instead; a gate job that skips it would count as a pass when
  # the gate itself fails.
  pull_request:

permissions:
  contents: read

# Push runs share one group so deploys publish in push order. Each PR gets its
# own group, so a PR run never waits for, or cancels, another PR or a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A unique job id, because a required check is matched by job name.
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: configure pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: install
        run: npm ci
        working-directory: website
      - name: build
        run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: website/build

  deploy:
    needs: docs-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
