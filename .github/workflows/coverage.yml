name: coverage
on:
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'CHANGELOG-*.md'
      - 'website/docs/changelog.md'
      - '.github/workflows/coverage.yml'
      - '.github/coverage-per-file-exceptions.txt'
permissions:
  contents: read
env:
  # Serialize rustup's component writes; parallel installs trip the runner's
  # virtualized disk (os error 5, #553). Inert for steps that don't call rustup.
  RUSTUP_IO_THREADS: "1"
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-llvm-cov
      - name: Detect CPU count
        run: echo "CARGO_BUILD_JOBS=$(scripts/core_count.sh)" >> "$GITHUB_ENV"
      # --workspace: without it, cargo llvm-cov only measures the root
      # `llmenv` package, silently excluding every `crates/*` sub-crate
      # (#1465) — a regression introduced entirely inside one of them would
      # pass this gate unmeasured.
      # --no-report collects profile data without generating a report yet, so
      # the two gates below (aggregate + per-file) both reuse it instead of
      # re-running the whole test suite twice.
      - run: cargo llvm-cov --workspace --all-features --no-report
      # Print the per-file summary to the job log and fail if total line
      # coverage drops below the baseline minus tolerance. Baseline at the
      # time this landed was 65.12%; see issue #57. No external service.
      #
      # `cargo llvm-cov report` (the non-deprecated way to regenerate a report
      # from already-collected profile data) does not accept --workspace at
      # all in cargo-llvm-cov 0.8.4 and silently reports only the root
      # package — reintroducing #1465 despite the flag already being on the
      # collection step above. --no-run is deprecated in favor of `report`,
      # but --workspace still works there and it still reuses the profile
      # data instead of re-running tests (confirmed: ~3s, not the full suite).
      - run: cargo llvm-cov --workspace --all-features --no-run --summary-only --fail-under-lines 64
      # Aggregate coverage lets one well-covered file compensate for a poorly
      # covered one (#1508); this gate catches that by holding every file to
      # the same floor individually, mirroring vitest's coverage.thresholds.perFile.
      - run: cargo llvm-cov --workspace --all-features --no-run --json --output-path coverage.json
      - run: scripts/coverage-per-file-floor.sh coverage.json 40
