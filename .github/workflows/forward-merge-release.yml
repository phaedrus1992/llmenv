name: Forward-merge release branches

on:
  push:
    branches:
      - 'release/**'

# Default to read-only; the job that needs write declares it explicitly.
permissions:
  contents: read

concurrency:
  group: forward-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forward-merge:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          # GITHUB_TOKEN can never push a change that touches
          # .github/workflows/*.yml (GitHub's own restriction, not this job's
          # permissions). A source release branch's cascade only crosses that
          # boundary when its own workflow files differ from a target's, but
          # the cascade can't know that in advance, so every push uses the PAT
          # once it's set. Falls back to the default token if the secret is
          # unset, so the workflow keeps working (minus workflow-file pushes)
          # before FORWARD_MERGE_PAT is added.
          token: ${{ secrets.FORWARD_MERGE_PAT || github.token }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect release branches
        id: detect
        run: |
          set -euo pipefail
          CURRENT=$(git rev-parse --abbrev-ref HEAD)
          # `git branch -r` indents each line with two spaces; strip that (and the
          # `origin/` prefix) before matching, otherwise the cascade compares
          # "  release/1.x" against "release/1.x", never matches the current
          # branch, and aborts with "not a versioned release branch".
          BRANCHES=$(git branch -r | sed 's|^[[:space:]]*origin/||' \
            | grep -E '^release/[0-9]+\.x$' | sort -V)
          # Random delimiter so a branch literally named "EOF" can't break the
          # multiline output value (GitHub-recommended pattern).
          DELIM="branches-$(uuidgen)"
          {
            echo "current=$CURRENT"
            echo "branches<<$DELIM"
            echo "$BRANCHES"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure label exists
        continue-on-error: true
        run: |
          gh label create forward-merge-conflict \
            --description "Conflict in forward-merge release cascade" \
            --color "d73a4a" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Forward-merge cascade
        env:
          CURRENT: ${{ steps.detect.outputs.current }}
          BRANCHES: ${{ steps.detect.outputs.branches }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Build target list: every newer release branch (semver order) + main.
          TARGETS=()
          FOUND=0
          while IFS= read -r BRANCH; do
            if [[ "$FOUND" -eq 1 ]]; then
              TARGETS+=("$BRANCH")
            fi
            if [[ "$BRANCH" == "$CURRENT" ]]; then
              FOUND=1
            fi
          done <<< "$BRANCHES"

          # Guard: the pushed branch must be a recognized versioned release line.
          # The trigger (release/**) is broader than the X.x regex, so a branch
          # like release/foo would otherwise fall through and merge into main.
          if [[ "$FOUND" -eq 0 ]]; then
            echo "::warning::$CURRENT is not a versioned release/X.x branch; skipping cascade"
            exit 0
          fi

          TARGETS+=("main")

          # Track whether the cascade halted early so the run fails visibly
          # rather than silently leaving downstream targets unmerged.
          HALTED=""

          # The cascade is a *chain*: each target is merged from the previous
          # link, not from the branch that was pushed. Pushing release/3.x with
          # release/4.x in between means release/3.x → release/4.x → main, so
          # main receives release/4.x's own commits along with the 3.x fix.
          # Merging origin/$CURRENT into every target independently instead
          # (which is what this did before) left main with 3.x merged directly
          # and 4.x's commits still absent, and tangled the merge bases so the
          # next 4.x → main merge re-conflicted over the same files.
          SOURCE_REF="origin/$CURRENT"
          SOURCE_DESC="$CURRENT"

          # Abort on conflict — never commit a broken merge or push a conflict
          # branch. The cascade exits with a clear error so whoever pushed to the
          # release branch resolves manually.
          bail_on_conflict() {
            local src="$1" tgt="$2"
            echo "::error::Merge conflict: $src into $tgt has conflicts. Resolve manually:"
            echo "::error::  git checkout $tgt && git merge $src"
            echo "::error::Cascade halted; downstream targets not merged"
            return 1
          }

          # Whether every difference the source introduced in $1 since the merge
          # base is a version literal.
          #
          # Blanking every `version = "..."` on both sides and comparing is the
          # whole test: if the files are then identical, versions are the only
          # thing that changed. A line the source actually added (a new
          # dependency, say) survives blanking and makes them differ, so it can
          # never be mistaken for a version bump and silently dropped. Comparing
          # the diff's changed lines against a version-shaped regex instead would
          # get exactly that case wrong — `serde = { version = "1" }` matches the
          # regex too.
          version_only_change() {
            local file="$1" base before after
            base=$(git merge-base HEAD "$SOURCE_REF") || return 1
            before=$(git show "$base:$file" 2>/dev/null \
              | sed -E 's/version = "[^"]*"/version = "*"/g') || return 1
            after=$(git show "$SOURCE_REF:$file" 2>/dev/null \
              | sed -E 's/version = "[^"]*"/version = "*"/g') || return 1
            [[ "$before" == "$after" ]]
          }

          # Resolve the conflicts a forward-merge produces every single time, and
          # only those. Returns non-zero the moment it meets one it has no rule
          # for, leaving the caller to bail.
          #
          # Two classes:
          #   * website/docs/changelog.md is generated by
          #     scripts/sync-changelog-doc.sh, so it's regenerated from the
          #     merged CHANGELOG-*.md rather than reconciled line by line.
          #   * The version manifests conflict structurally: two release lines
          #     always carry different versions, so `release/4.x` (4.0.0-alpha.1)
          #     into `main` (5.0.0-alpha.1) collides on all six every time. A
          #     forward-merge must never change the target's own version, so the
          #     target's side wins — but only after `version_only_change` proves
          #     the source's side holds nothing else. Keeping the target's
          #     manifests *and* its Cargo.lock leaves the pair mutually
          #     consistent, so no `cargo` run is needed to repair the lock.
          auto_resolve_conflicts() {
            local file
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              case "$file" in
                website/docs/changelog.md)
                  echo "  $file: regenerating from the merged CHANGELOG-*.md sources"
                  git checkout --ours -- "$file"
                  bash scripts/sync-changelog-doc.sh
                  git add -- "$file"
                  ;;
                Cargo.toml | Cargo.lock | crates/*/Cargo.toml)
                  if ! version_only_change "$file"; then
                    echo "::error::$file: $SOURCE_DESC changed more than version numbers here, so keeping $TARGET's copy could drop real changes"
                    return 1
                  fi
                  echo "  $file: keeping $TARGET's own version"
                  git checkout --ours -- "$file"
                  git add -- "$file"
                  ;;
                *)
                  echo "::error::$file: conflict has no auto-resolution rule"
                  return 1
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=U)
            [[ -z "$(git diff --name-only --diff-filter=U)" ]]
          }

          for TARGET in "${TARGETS[@]}"; do
            echo "::group::Forward-merge $SOURCE_DESC → $TARGET"
            TARGET_SHA=$(git rev-parse "origin/$TARGET" 2>/dev/null || echo "")

            # `--is-ancestor`, not sha equality: once the chain has merged into
            # an earlier target the heads are never equal, but the target can
            # still already contain everything the source has (e.g. a human
            # resolved the merge by hand first). Merging then would add an empty
            # commit for no reason.
            if [[ -n "$TARGET_SHA" ]] \
                && git merge-base --is-ancestor "$SOURCE_REF" "origin/$TARGET"; then
              echo "Target $TARGET already contains $SOURCE_DESC"
              echo "::endgroup::"
              continue
            fi

            # `if VAR=$(cmd); then` (not a bare `VAR=$(cmd); RC=$?`) — under
            # `set -e`, a bare assignment's exit status IS the command's, so a
            # failing command here would kill the script before RC=$? ever ran.
            if FETCH_STDERR=$(git fetch origin "$CURRENT" "$TARGET" 2>&1 >/dev/null); then
              FETCH_RC=0
            else
              FETCH_RC=$?
            fi
            if [[ $FETCH_RC -ne 0 ]]; then
              if [[ -n "$FETCH_STDERR" ]]; then
                echo "::warning::fetch of $CURRENT $TARGET failed: ${FETCH_STDERR//$'\n'/ }"
              else
                echo "::warning::fetch of $CURRENT $TARGET failed (exit $FETCH_RC; no stderr)"
              fi
              echo "::endgroup::"
              HALTED="fetch failed for $TARGET"
              break
            fi

            git checkout -q "origin/$TARGET"

            MERGE_BRANCH="forward-merge/$SOURCE_DESC-to-$TARGET"

            if ! git merge --no-commit --no-ff "$SOURCE_REF" 2>/dev/null; then
              echo "Conflicts; attempting auto-resolution:"
              if auto_resolve_conflicts; then
                git commit --no-edit
              else
                if ! git merge --abort; then
                  echo "::error::Failed to abort merge; working tree may be inconsistent"
                  echo "::endgroup::"
                  HALTED="merge abort failed at $TARGET"
                  break
                fi
                bail_on_conflict "$SOURCE_DESC" "$TARGET" || true
                echo "::endgroup::"
                HALTED="conflict at $TARGET"
                break
              fi
            else
              if ! git merge --abort; then
                echo "::error::Failed to abort merge; working tree may be inconsistent"
                echo "::endgroup::"
                HALTED="merge abort failed at $TARGET"
                break
              fi
              git checkout -q "origin/$TARGET"
              if ! git merge --no-edit "$SOURCE_REF"; then
                echo "::error::Failed to merge $SOURCE_DESC into $TARGET"
                echo "::endgroup::"
                HALTED="merge failed at $TARGET"
                break
              fi
            fi

            # Land the merge directly so the fix propagates automatically — main
            # is the final target and is forward-merged the same way as every
            # release branch, with no manual step. If a target is branch-protected
            # the push is rejected; fall back to opening a PR and halt so the
            # remaining (now un-merged) targets aren't silently skipped.
            # See the FETCH_RC comment above — same set -e hazard.
            if PUSH_STDERR=$(git push origin HEAD:"$TARGET" 2>&1 >/dev/null); then
              PUSH_RC=0
            else
              PUSH_RC=$?
            fi
            if [[ $PUSH_RC -eq 0 ]]; then
              echo "Pushed directly to $TARGET"
              # Advance the chain. `update-ref` on the remote-tracking ref (no
              # network) rather than reusing the raw HEAD sha, so the next
              # merge's generated commit message names the branch instead of
              # reading "Merge commit '<sha>'".
              git update-ref "refs/remotes/origin/$TARGET" HEAD
              SOURCE_REF="origin/$TARGET"
              SOURCE_DESC="$TARGET"
              # A push made with GITHUB_TOKEN deliberately doesn't trigger other
              # workflows (GitHub's anti-recursion rule), so docs.yml's `push`
              # trigger never fires for this forward-merge even though it landed
              # on main. Dispatch it explicitly when website/ actually changed.
              if [[ "$TARGET" == "main" ]] && [[ -n "$TARGET_SHA" ]] \
                  && ! git diff --quiet "$TARGET_SHA" HEAD -- website/; then
                echo "website/ changed on main; triggering docs deploy"
                gh workflow run docs.yml --ref main || echo "::warning::failed to dispatch docs.yml"
              fi
            else
              # Log the actual error so operators can distinguish protection
              # rejections from auth/network failures.
              if [[ -n "$PUSH_STDERR" ]]; then
                echo "::warning::push to $TARGET failed: ${PUSH_STDERR//$'\n'/ }"
              else
                echo "::warning::push to $TARGET failed (exit $PUSH_RC; no stderr)"
              fi
              # Same set -e hazard as FETCH_RC above — a bare command's exit
              # status would kill the script before ls_rc=$? ever ran.
              if git ls-remote --exit-code --heads origin "$MERGE_BRANCH" >/dev/null 2>&1; then
                ls_rc=0
              else
                ls_rc=$?
              fi
              if [[ $ls_rc -eq 0 ]]; then
                echo "::warning::$MERGE_BRANCH already exists; not overwriting in-progress resolution"
                echo "::error::Cascade halted: $TARGET is protected and $MERGE_BRANCH is already open"
                echo "::endgroup::"
                HALTED="protected branch $TARGET"
                break
              elif [[ $ls_rc -ne 2 ]]; then
                echo "::error::Network error checking if $MERGE_BRANCH exists (exit $ls_rc); halting cascade"
                echo "::endgroup::"
                HALTED="network error at $TARGET"
                break
              fi

              # Create branch pointing to current HEAD (the merge commit at line 205),
              # not origin/$TARGET (which would discard the merge commit).
              if ! git checkout -B "$MERGE_BRANCH"; then
                echo "::error::Failed to create merge branch $MERGE_BRANCH"
                echo "::endgroup::"
                HALTED="checkout failed at $TARGET"
                break
              fi
              if ! git push origin "$MERGE_BRANCH" --force-with-lease; then
                echo "::error::Push to merge branch $MERGE_BRANCH failed; cannot open PR"
                echo "::endgroup::"
                HALTED="protected branch $TARGET"
                break
              fi

              if ! gh pr create --base "$TARGET" --head "$MERGE_BRANCH" \
                --title "Forward-merge $SOURCE_DESC into $TARGET" \
                --body "Direct push to $TARGET blocked by branch protection; opening PR."; then
                echo "::error::Failed to create PR for $MERGE_BRANCH after protected-branch push was rejected"
              else
                echo "::error::Cascade halted: $TARGET is protected, opened PR instead"
              fi
              echo "::endgroup::"
              HALTED="protected branch $TARGET"
              break
            fi

            echo "::endgroup::"
          done

          if [[ -n "$HALTED" ]]; then
            echo "Forward-merge cascade halted ($HALTED); downstream targets not merged"
            exit 1
          fi

          echo "Forward-merge cascade completed"
