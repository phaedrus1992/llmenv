name: Forward-merge release branches

on:
  push:
    branches:
      - 'release/**'
  # #1675: a push-triggered run that finds forward-merge/<source>-to-<target>
  # already open halts instead of retrying (see the ls-remote guard below).
  # Once that PR finally merges, nothing re-fires — every commit that piled
  # up on the source branch during the wait already fired-and-halted once,
  # and `push` never sees them again. Re-run the same cascade from its
  # source branch once the blocking PR clears.
  pull_request:
    types: [closed]

# Default to read-only; the job that needs write declares it explicitly.
permissions:
  contents: read

concurrency:
  # #1675: a pull_request-triggered retry groups on its own head ref (the
  # forward-merge/<source>-to-<target> branch name), not github.ref (which
  # for a pull_request event is the synthetic refs/pull/<n>/merge ref, never
  # equal to the push-triggered group for the same source branch). The two
  # trigger types don't need to serialize against each other: push-triggered
  # cascades always go through the PR path, so a stray concurrent run costs
  # wasted CI time, not a corrupted push.
  group: forward-merge-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  forward-merge:
    runs-on: ubuntu-latest
    # Stops the cascade's own push from re-triggering this workflow on the
    # target branch. The anti-recursion rule does not cover these pushes:
    # since #2796 they go out as the phaedrus-sync App. The loop stays closed
    # because the cascade never pushes to a target: push_with_app_token only
    # pushes to a forward-merge/* staging branch, which never matches this
    # workflow's `release/**` trigger (#1504, #1524, #2798).
    #
    # #1675: the second half of the OR admits only a merged, same-repo PR
    # whose head is one of this workflow's own forward-merge/* staging
    # branches, opened against a release/main target — never an arbitrary
    # closed PR, and never a fork PR that merely names its own branch to
    # match the prefix. A fork PR can't reach this job's write permissions
    # or the App secrets today regardless (this is `pull_request`, not
    # `pull_request_target`, so GitHub itself withholds both from a
    # fork-headed run) — the repo/base check is defense in depth against
    # that platform default ever being loosened, not the only thing
    # stopping it.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       (github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'forward-merge/') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (startsWith(github.event.pull_request.base.ref, 'release/') ||
         github.event.pull_request.base.ref == 'main')))
    # The App token pushes, opens PRs, and merges them (#2796). GITHUB_TOKEN only
    # fetches, lists PRs, and approves gated runs.
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      # #1675: for a push, the branch that was pushed IS the cascade's
      # source. For a merged forward-merge/* PR, that branch (and its PR)
      # are gone — the source is encoded in its own name,
      # forward-merge/<source>-to-<target>, with the `-to-` separator safe
      # to split on because neither a release branch nor `main` ever
      # contains one. Re-check out that source so the rest of this job runs
      # unchanged, exactly as if it had just been pushed again.
      #
      # The parsed result feeds straight into the next step's `ref:` input,
      # so it must never reach actions/checkout unvalidated: an empty or
      # malformed parse (a head ref that passes the job-level prefix check
      # above but isn't shaped forward-merge/<source>-to-<target> — no
      # separator, more than one, or nothing either side of it) is not a
      # theoretical case to shrug off. actions/checkout treats an empty
      # `ref:` as unset and falls back to the triggering event's own ref,
      # which for a closed pull_request is its *base* branch — so the job
      # would silently check out and, if that base happens to be a real
      # release/X.x line, run the whole cascade against the wrong branch
      # with no error anywhere. Validate against the only two shapes a real
      # cascade source ever has and fail loudly on anything else.
      - name: Determine source branch
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_REF: ${{ github.ref_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "ref=$PUSHED_REF" >> "$GITHUB_OUTPUT"
          else
            rest="${PR_HEAD_REF#forward-merge/}"
            source_branch="${rest%-to-*}"
            if [[ ! "$source_branch" =~ ^(release/[0-9]+\.x|main)$ ]]; then
              # #2240: this ref has not passed the regex yet, so strip `::` as in #1543.
              head_ref_display="${PR_HEAD_REF//::/  }"
              echo "::error::could not parse a valid source branch out of forward-merge PR head ref '$head_ref_display' (expected forward-merge/<source>-to-<target>, source one of release/X.x or main)"
              exit 1
            fi
            echo "ref=$source_branch" >> "$GITHUB_OUTPUT"
          fi

      # #2796: the cascade pushes, opens PRs, and enables auto-merge as the phaedrus-sync
      # GitHub App. A GitHub App token is not GITHUB_TOKEN, so its pushes start the next
      # cascade hop and its PRs are not authored by github-actions. The App is required.
      - name: Check cascade credentials
        env:
          SYNC_APP_ID: ${{ secrets.SYNC_APP_ID }}
          SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # The App needs both of its secrets. A missing one fails the step and names it.
          check_cascade_credential() {
            local missing=""
            [[ -n "${SYNC_APP_ID:-}" ]] || missing="SYNC_APP_ID"
            [[ -n "${SYNC_APP_PRIVATE_KEY:-}" ]] || missing="${missing:+$missing and }SYNC_APP_PRIVATE_KEY"
            if [[ -n "$missing" ]]; then
              echo "::error::Missing $missing. Set the repository secrets SYNC_APP_ID and SYNC_APP_PRIVATE_KEY for the phaedrus-sync App (installed on this repository). See website/docs/release.md." >&2
              return 1
            fi
          }
          check_cascade_credential

      - name: Mint cascade app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # The ref is validated above to release/X.x or main, so this step never checks out
      # code from a pull request. The cascade needs the credential for fetch and push, so
      # persist-credentials stays true. CodeQL alert actions/untrusted-checkout (#2475)
      # is dismissed on that basis.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect release branches
        id: detect
        run: |
          set -euo pipefail
          CURRENT=$(git rev-parse --abbrev-ref HEAD)
          # `git branch -r` indents each line with two spaces; strip that (and the
          # `origin/` prefix) before matching, otherwise the cascade compares
          # "  release/1.x" against "release/1.x", never matches the current
          # branch, and aborts with "not a versioned release branch".
          BRANCHES=$(git branch -r | sed 's|^[[:space:]]*origin/||' \
            | grep -E '^release/[0-9]+\.x$' | sort -V)
          # Random delimiter so a branch literally named "EOF" can't break the
          # multiline output value (GitHub-recommended pattern).
          DELIM="branches-$(uuidgen)"
          {
            echo "current=$CURRENT"
            echo "branches<<$DELIM"
            echo "$BRANCHES"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      # Lockfile conflicts are resolved by regenerating the lockfile, so the job
      # needs both toolchains. Pins match ci.yml and docs.yml. (#2166)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master at 683b588
        with:
          toolchain: stable

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26.12.1
          package-manager-cache: false

      - name: Forward-merge cascade
        env:
          CURRENT: ${{ steps.detect.outputs.current }}
          BRANCHES: ${{ steps.detect.outputs.branches }}
          # Empty for a push. For a retry, the base and the head branch of the
          # merged forward-merge PR.
          RETRY_TARGET: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
          RETRY_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || '' }}
          # Deliberately left at step level, unlike APP_TOKEN below —
          # any workspace code that runs still inherits GH_TOKEN via env and
          # via the persisted checkout credential in .git/config either way,
          # so scoping it here wouldn't contain anything. What actually
          # closes that exposure is the #1532 fix itself: the changelog.md
          # arm below only ever runs a pinned, already-verified copy of
          # scripts/sync-changelog-doc.sh, never the merged tree's.
          GH_TOKEN: ${{ github.token }}
          # #2796: the App token, used only for the push and the PR calls. Kept out of
          # GH_TOKEN and the checkout, so the tools that run on the merged tree (cargo
          # update, npm install) never hold it.
          APP_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail

          # #1532, #2796: capture the App token into a local (non-exported) shell
          # variable, then unset it from this process's own environment. Only
          # push_with_app_token and the PR calls read it, so a subprocess this step
          # spawns (bash scripts/sync-changelog-doc.sh included) does not inherit it.
          _app_token="${APP_TOKEN:-}"
          unset APP_TOKEN
          require_app_token() {
            if [[ -z "${_app_token:-}" ]]; then
              echo "::error::No App token was minted. Check the Mint cascade app token step." >&2
              return 1
            fi
          }
          require_app_token

          # GITHUB_TOKEN can never push a change that touches
          # .github/workflows/*.yml (GitHub's own restriction, not this job's
          # permissions), and its pushes do not start other workflows. So every
          # push below goes through this helper, which pushes as the App (#2796).
          # Scoped to just the push (a `-c` override for one invocation), not the
          # whole job's git credential, per #1504: fetch, merge, and checkout still
          # run as the job-scoped GITHUB_TOKEN persisted by the checkout step.
          #
          # #1540: `http.extraheader` is a multi-valued git config key, so a
          # `-c` override does NOT replace the persisted header the checkout
          # step wrote — it adds alongside it, and GitHub rejects the
          # resulting double `Authorization` header with a 400. An empty
          # `-c key=` override doesn't unset it either (proven against real
          # git in __tests__/forward-merge-release-guards.sh) — it just adds
          # a third, empty value.
          #
          # actions/checkout's persist-credentials: true does NOT write the
          # header directly into .git/config (confirmed from a live run's
          # own Checkout step log, after a first attempt at this fix that
          # assumed it did still hit the same 400 in production). It writes
          # the header into an external temp file and adds
          # `includeIf.gitdir:*.path` entries in .git/config pointing at
          # that file. A plain `--unset-all` on the extraheader key finds
          # nothing directly in .git/config (exit 5, "no such key") and
          # silently no-ops, while the header stays effectively active via
          # the include. The includeIf entries themselves must be removed —
          # the same cleanup actions/checkout's own "Post Checkout" step
          # performs at job end, just done early. Because we're doing that
          # cleanup ourselves ahead of time, Post Checkout's own pass finds
          # no includeIf entries left and never gets to the file-deletion
          # step it would otherwise run, so push_with_app_token also deletes the
          # underlying credentials file itself (matched narrowly by name
          # under $RUNNER_TEMP) to avoid orphaning it. This is safe to do
          # unconditionally here: push_with_app_token's only call site is the last
          # git network operation before the cascade halts (it's followed
          # only by `gh pr create`, then `break`), so nothing downstream
          # needs the persisted GITHUB_TOKEN credential again.
          push_with_app_token() {
            # Enforces the single-call-site invariant above at runtime
            # instead of leaving it to a comment: this exact assumption
            # (about what's safe to tear down and when) has already been
            # wrong once for this function (#1540). A second call in the
            # same job would otherwise silently push with no credential at
            # all, having already dropped it the first time.
            if [[ "${_push_with_app_token_credential_dropped:-0}" -eq 1 ]]; then
              echo "::error::push_with_app_token called more than once in this job after already dropping the persisted checkout credential -- update the caller, this function assumes a single last call"
              exit 1
            fi
            _push_with_app_token_credential_dropped=1
            local auth
            # Callers run this as `if ! push_with_app_token`, so set -e is off in
            # here: every step that can fail is checked by hand.
            if ! auth="$(printf 'x-access-token:%s' "$_app_token" | base64 -w0)" || [[ -z "$auth" ]]; then
              echo "::error::could not encode the App token for the push header"
              exit 1
            fi
            # GitHub's log scrubber masks the literal token value, not its
            # base64 encoding — register the encoded form too, so a stray
            # git trace or `set -x` can't print a trivially-reversible copy.
            echo "::add-mask::$auth"
            # This is expected to be a no-op in practice (exit 5, "no such
            # key" — see the includeIf removal below for where the actual
            # persisted header lives), kept as defense in depth in case a
            # future checkout mechanism ever does write it directly. A bare
            # `|| true` would also swallow a real config-write failure
            # (e.g. exit 128 outside a git work tree, exit 255 if
            # .git/config can't be locked), silently discarding the
            # diagnostic for why.
            # `if ! VAR=$(cmd); then RC=$?; fi` would be wrong here: with
            # the `!` negation, `$?` inside the `then` block reflects the
            # negated condition (always 0), not cmd's real exit code — see
            # the FETCH_RC pattern in the cascade loop for why this if/else form
            # is used instead.
            if UNSET_OUT=$(git config --local --unset-all http.https://github.com/.extraheader 2>&1); then
              UNSET_RC=0
            else
              UNSET_RC=$?
            fi
            if [[ $UNSET_RC -ne 0 && $UNSET_RC -ne 5 ]]; then
              echo "::error::failed to clear persisted extraheader before the App push (git config exit $UNSET_RC): $UNSET_OUT"
              exit 1
            fi
            # `--get-regexp` exits 1 when nothing matches (e.g.
            # persist-credentials: false) -- a normal empty result, not a
            # failure. Anything else (e.g. exit 128 outside a git work
            # tree) is a real failure and must halt, same reasoning as
            # UNSET_RC above -- captured via if/else, not `2>/dev/null ||
            # true`, which would swallow both cases identically.
            if INCLUDE_KEYS=$(git config --local --name-only --get-regexp '^includeIf\.gitdir:' 2>&1); then
              INCLUDE_KEYS_RC=0
            else
              INCLUDE_KEYS_RC=$?
            fi
            if [[ $INCLUDE_KEYS_RC -ne 0 && $INCLUDE_KEYS_RC -ne 1 ]]; then
              echo "::error::failed to enumerate includeIf.gitdir entries before the App push (git config exit $INCLUDE_KEYS_RC): $INCLUDE_KEYS"
              exit 1
            fi
            if [[ $INCLUDE_KEYS_RC -eq 0 ]]; then
              while IFS= read -r include_key; do
                [[ -n "$include_key" ]] || continue
                # Read the value (the credentials file path) before
                # unsetting the key -- actions/checkout's own Post
                # Checkout cleanup discovers that same path this same
                # way, then deletes the file. If we unset the key first,
                # Post Checkout finds no includeIf entries left and never
                # deletes it, orphaning it on the runner.
                if INCLUDE_VALUE=$(git config --local --get-all "$include_key" 2>&1); then
                  INCLUDE_GET_RC=0
                else
                  INCLUDE_GET_RC=$?
                fi
                if [[ $INCLUDE_GET_RC -ne 0 ]]; then
                  echo "::error::failed to read $include_key before removing it (git config exit $INCLUDE_GET_RC): $INCLUDE_VALUE"
                  exit 1
                fi
                if INCLUDE_UNSET_OUT=$(git config --local --unset-all "$include_key" 2>&1); then
                  INCLUDE_UNSET_RC=0
                else
                  INCLUDE_UNSET_RC=$?
                fi
                if [[ $INCLUDE_UNSET_RC -ne 0 ]]; then
                  echo "::error::failed to remove $include_key before the App push (git config exit $INCLUDE_UNSET_RC): $INCLUDE_UNSET_OUT"
                  exit 1
                fi
                # Only delete a path that matches the file
                # actions/checkout itself creates under $RUNNER_TEMP --
                # never touch a value this job didn't create.
                while IFS= read -r include_value_line; do
                  [[ -n "$include_value_line" ]] || continue
                  if [[ -n "${RUNNER_TEMP:-}" \
                      && "$include_value_line" == "$RUNNER_TEMP"/git-credentials-*.config ]]; then
                    if ! rm -f "$include_value_line"; then
                      echo "::error::failed to delete the persisted credentials file $include_value_line"
                      exit 1
                    fi
                  fi
                done <<< "$INCLUDE_VALUE"
              done <<< "$INCLUDE_KEYS"
            fi
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" push "$@"
          }

          # #2796: request auto-merge with a merge commit. The merge then runs as the App
          # once required checks pass, and its close event resumes the cascade. A refused
          # request leaves the PR open, so the refusal is also posted on the PR.
          enable_auto_merge() {
            local branch="$1" err
            if err=$(GH_TOKEN="${_app_token:-}" gh pr merge "$branch" --auto --merge 2>&1 >/dev/null); then
              echo "Auto-merge enabled for $branch; it merges once its required checks pass."
              return 0
            fi
            local cerr
            err="${err//::/  }"
            err="${err//$'\n'/ }"
            echo "::warning::Could not enable auto-merge for $branch; merge it by hand once its checks pass: $err"
            echo "- Auto-merge refused for $branch ($err). Merge it by hand once its checks pass." >> "${GITHUB_STEP_SUMMARY:?GITHUB_STEP_SUMMARY is unset}"
            if ! cerr=$(GH_TOKEN="${_app_token:-}" gh pr comment "$branch" --body "Auto-merge was refused: $err. Merge this PR by hand once its checks pass; the cascade resumes when it merges." 2>&1 >/dev/null); then
              cerr="${cerr//::/  }"
              echo "::warning::Could not comment on $branch about the refused auto-merge: ${cerr//$'\n'/ }"
            fi
          }

          # The cascade stops at a failed hop, or waits on an open PR. A wait exits zero.
          finish_cascade() {
            if [[ -n "${HALTED:-}" ]]; then
              echo "Forward-merge cascade halted ($HALTED); downstream targets not merged"
              return 1
            fi
            if [[ -n "${HELD:-}" ]]; then
              echo "Forward-merge cascade waiting on $HELD; the next targets run when it merges"
              echo "- Forward-merge cascade waiting on $HELD" >> "${GITHUB_STEP_SUMMARY:?GITHUB_STEP_SUMMARY is unset}"
              return 0
            fi
            echo "Forward-merge cascade completed"
          }

          # GitHub sometimes gates this PR's `pull_request`-triggered runs
          # behind an `action_required` manual-approval check -- normally a
          # fork-PR-only safety gate, but observed firing on this same-repo,
          # non-first-time-contributor PR too (#1564; GitHub-side root cause
          # not confirmed, and reproduction is intermittent -- most cascades
          # that open a PR don't hit it). The cascade opens a PR so required
          # checks run before merge, so a run stuck on that gate with nobody watching silently
          # defeats the point. Poll for runs against $1 (a commit SHA) on
          # branch $2 sitting in that state and approve them. action_required
          # is the fork gate, and a fork can push the same public SHA, so only
          # this repository's own runs on the merge branch qualify (#2273).
          #
          # Never halts the cascade on failure: an approval miss here still
          # leaves the PR in place for a human (or a later poll, e.g. the next
          # push to this branch re-running this same check) to approve
          # manually, so a warning is the right severity, not an error.
          approve_pending_runs() {
            local sha="$1" branch="$2" runs ids id err_file err last_err="" list_ok=0
            local approved="" warned=""
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::warning::approve_pending_runs got no valid commit SHA; check the PR for runs that wait for approval"
              return 0
            fi
            if ! err_file=$(mktemp); then
              echo "::warning::approve_pending_runs could not create a temp file; approve runs for $sha by hand"
              return 0
            fi
            # Every round, not only until the first hit: a workflow can start,
            # and be gated, after the others. The server filters by status and
            # branch and every page is read, so a flood of fork runs on the same
            # SHA cannot push this repo's run off the first page (#2273).
            for _ in 1 2 3 4 5 6; do
              ids=""
              if runs=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" --paginate \
                  -f head_sha="$sha" -f status=action_required -f branch="$branch" \
                  -f per_page=100 2>"$err_file"); then
                # A list counts as read only when jq also parses it; a bad reply is
                # not "no run waited" (#1564).
                if ids=$(jq -r --arg repo "$GITHUB_REPOSITORY" --arg branch "$branch" \
                    '.workflow_runs[] | select(.conclusion == "action_required"
                      and .head_repository.full_name == $repo and .head_branch == $branch) | .id' \
                    <<< "$runs" 2>"$err_file"); then
                  list_ok=1
                else
                  last_err="$(<"$err_file")"
                  ids=""
                fi
              else
                last_err="$(<"$err_file")"
              fi
              while IFS= read -r id; do
                if [[ -z "$id" || " $approved " == *" $id "* ]]; then
                  continue
                fi
                echo "Approving action_required run $id for $sha"
                if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" \
                    >/dev/null 2>"$err_file"; then
                  approved+=" $id"
                elif [[ " $warned " != *" $id "* ]]; then
                  # Warn once; a later round tries again.
                  warned+=" $id"
                  err="$(<"$err_file")"
                  err="${err//$'\n'/ }"
                  echo "::warning::failed to approve run $id for $sha: ${err//::/  }. A later poll tries again; if none succeeds, approve it by hand."
                fi
              done <<< "$ids"
              sleep 10
            done
            rm -f "$err_file"
            if [[ "$list_ok" -eq 0 ]]; then
              last_err="${last_err//$'\n'/ }"
              echo "::warning::could not list runs for $sha: ${last_err//::/  }. Check the PR for runs that wait for approval."
            elif [[ -z "$approved" && -z "$warned" ]]; then
              echo "No run for $sha waited for approval"
            fi
          }

          # Build target list: every newer release branch (semver order) + main.
          TARGETS=()
          FOUND=0
          while IFS= read -r BRANCH; do
            if [[ "$FOUND" -eq 1 ]]; then
              TARGETS+=("$BRANCH")
            fi
            if [[ "$BRANCH" == "$CURRENT" ]]; then
              FOUND=1
            fi
          done <<< "$BRANCHES"

          # Guard: the pushed branch must be a recognized versioned release line.
          # The trigger (release/**) is broader than the X.x regex, so a branch
          # like release/foo would otherwise fall through and merge into main.
          if [[ "$FOUND" -eq 0 ]]; then
            # #2240: CURRENT failed the regex, so strip `::` as in #1543.
            echo "::warning::${CURRENT//::/  } is not a versioned release/X.x branch; skipping cascade"
            exit 0
          fi

          # From here on, CURRENT and every TARGET match the detect step's
          # release/X.x regex or are `main`, so a `::` cannot reach the echoes
          # of CURRENT, TARGET, SOURCE_DESC or MERGE_BRANCH below (#2240).
          TARGETS+=("main")

          # #2294: a retry stops at its own target once that target holds the
          # source (see the up-to-date check in the loop), so the target must be
          # downstream of CURRENT and must be the one its head branch names. A
          # writer can change a PR's base after it opens.
          if [[ -n "${RETRY_TARGET:-}" ]]; then
            RETRY_OK=0
            for T in "${TARGETS[@]}"; do
              if [[ "$T" == "$RETRY_TARGET" ]]; then
                RETRY_OK=1
              fi
            done
            if [[ "${RETRY_HEAD:-}" != *"-to-$RETRY_TARGET" ]]; then
              RETRY_OK=0
            fi
            if [[ "$RETRY_OK" -eq 0 ]]; then
              echo "::error::retry target ${RETRY_TARGET//::/  } does not match a downstream target of $CURRENT named by ${RETRY_HEAD//::/  }; not cascading"
              exit 1
            fi
          fi

          # Track whether the cascade halted early so the run fails visibly
          # rather than silently leaving downstream targets unmerged.
          HALTED=""
          HELD=""

          # The cascade is a *chain*: each target is merged from the previous
          # link, not from the branch that was pushed. Pushing release/3.x with
          # release/4.x in between means release/3.x → release/4.x → main, so
          # main receives release/4.x's own commits along with the 3.x fix.
          # Merging origin/$CURRENT into every target independently instead
          # (which is what this did before) left main with 3.x merged directly
          # and 4.x's commits still absent, and tangled the merge bases so the
          # next 4.x → main merge re-conflicted over the same files.
          SOURCE_REF="origin/$CURRENT"
          SOURCE_DESC="$CURRENT"

          # Abort on conflict — never commit a broken merge or push a conflict
          # branch. The cascade exits with a clear error so whoever pushed to the
          # release branch resolves manually.
          bail_on_conflict() {
            local src="$1" tgt="$2"
            # #2227: sanitize :: in attacker-controlled values (git refs) to prevent
            # log injection, same as #1543. Git ref names can't contain ::, so this is
            # defense-in-depth, but consistent with manifest_keeps_target.
            local src_display="${src//::/  }" tgt_display="${tgt//::/  }"
            echo "::error::Merge conflict: $src_display into $tgt_display has conflicts. Resolve manually:"
            echo "::error::  git checkout $tgt_display && git merge $src_display"
            echo "::error::Cascade halted; downstream targets not merged"
            return 1
          }

          # Whether keeping the target's copy of manifest $1 loses nothing the
          # source changed. Own-version differences and the same pin bumped on two
          # release lines pass. A new, removed or newer-than-target dependency does
          # not. A regex that blanks every `version = "..."` cannot tell these
          # apart: it would call a newer source pin "version-only" and drop it.
          # Rules: docs/design/issue-2166-forward-merge-drift.md
          #
          # Runs the target's own copy (HEAD, before this merge) — never the
          # source's or the merged tree's. This job holds the App token, so
          # it never runs a script from the merged tree or the source (#1532,
          # #2171, #2177). A target without the script has no rule to apply,
          # so the caller bails and a human merges once.
          #
          # Return codes the caller (auto_resolve_conflicts) branches on:
          #   0 = keeping the target's copy is safe
          #   1 = the check ran and found a real change beyond a version bump
          #   3 = the check could not run at all (a ref was unreadable) —
          #       distinct from 1 so the caller names the real cause instead
          #       of claiming a change was found when none was ever checked
          manifest_keeps_target() {
            local file="$1" base dir rc=0 missing=""
            local file_display="${file//::/  }"
            base=$(git merge-base HEAD "$SOURCE_REF") || return 3
            dir=$(mktemp -d) || return 3
            git show "HEAD:scripts/forward_merge_manifest.py" > "$dir/check.py" 2>/dev/null \
              || missing="the manifest-check script ($TARGET has no scripts/forward_merge_manifest.py yet)"
            [[ -n "$missing" ]] || git show "$base:$file" > "$dir/base.toml" 2>/dev/null \
              || missing="$file_display at the merge-base"
            [[ -n "$missing" ]] || git show "$SOURCE_REF:$file" > "$dir/source.toml" 2>/dev/null \
              || missing="$file_display on $SOURCE_DESC"
            [[ -n "$missing" ]] || git show "HEAD:$file" > "$dir/target.toml" 2>/dev/null \
              || missing="$file_display on $TARGET"
            if [[ -n "$missing" ]]; then
              echo "  $file_display: could not read ${missing//::/  }"
              rc=3
            else
              python3 "$dir/check.py" "$dir/base.toml" "$dir/source.toml" "$dir/target.toml" \
                2> "$dir/problems.txt" || rc=$?
              # Only exit 1 means "found a real change". Exit 2 (the check could
              # not run) and any other code, such as 127 for a missing python3,
              # mean the check gave no answer.
              if [[ "$rc" -ne 0 && "$rc" -ne 1 ]]; then
                rc=3
              fi
              # Log text comes from the source's files; strip `::` as in #1543.
              if [[ -s "$dir/problems.txt" ]]; then
                sed -e "s/::/  /g" -e "s|^|  $file_display: |" "$dir/problems.txt"
              fi
            fi
            rm -f "$dir/check.py" "$dir/base.toml" "$dir/source.toml" "$dir/target.toml" \
              "$dir/problems.txt"
            rmdir "$dir"
            return "$rc"
          }

          # Rebuild the lockfiles from the target's copy and the merged manifests.
          # A hand merge of a lockfile is never right. A lockfile-only change on the
          # source is not carried over; the target keeps its own. `--ignore-scripts`
          # keeps npm from running package code while this job holds GH_TOKEN and the App token.
          # Both tools print paths and names from the merged manifests, which a
          # source commit controls, so their output goes through the same `::`
          # filter as problems.txt (#1543). pipefail keeps the tool's exit code.
          regenerate_lockfiles() {
            if [[ "$1" -eq 1 ]]; then
              echo "  Cargo.lock: regenerating from the merged manifests"
              git checkout --ours -- Cargo.lock || {
                echo "::error::Cargo.lock: git checkout --ours failed" >&2
                return 1
              }
              if ! cargo update --workspace 2>&1 | sed -e 's/::/  /g'; then
                echo "::error::Cargo.lock: 'cargo update --workspace' failed" >&2
                return 1
              fi
              git add -- Cargo.lock || {
                echo "::error::Cargo.lock: git add failed" >&2
                return 1
              }
            fi
            if [[ "$2" -eq 1 ]]; then
              echo "  website/package-lock.json: regenerating from the merged package.json"
              git checkout --ours -- website/package-lock.json || {
                echo "::error::website/package-lock.json: git checkout --ours failed" >&2
                return 1
              }
              if ! (cd website && npm install --package-lock-only --ignore-scripts) 2>&1 \
                  | sed -e 's/::/  /g'; then
                echo "::error::website/package-lock.json: 'npm install --package-lock-only --ignore-scripts' failed" >&2
                return 1
              fi
              git add -- website/package-lock.json || {
                echo "::error::website/package-lock.json: git add failed" >&2
                return 1
              }
            fi
          }

          # Resolve the conflicts a forward-merge produces every single time, and
          # only those. Returns non-zero the moment it meets one it has no rule
          # for, leaving the caller to bail.
          #
          # Three classes:
          #   * website/docs/changelog.md is generated by
          #     scripts/sync-changelog-doc.sh, so it's regenerated from the
          #     merged CHANGELOG-*.md rather than reconciled line by line.
          #   * The version manifests conflict structurally: two release lines
          #     always carry different versions, so `release/4.x` (4.0.0-alpha.1)
          #     into `main` (5.0.0-alpha.1) collides on all six every time. A
          #     forward-merge must never change the target's own version, so the
          #     target's side wins — but only after `manifest_keeps_target` proves
          #     the source's side holds nothing else.
          #   * Cargo.lock and website/package-lock.json are regenerated once every
          #     other conflict is resolved, never merged by hand.
          auto_resolve_conflicts() {
            local file conflicted_files remaining lock_cargo=0 lock_npm=0 mkt_rc
            # Captured to a variable, with an explicit `|| { ...; return 1; }`
            # handler — not streamed via `< <(git diff ...)`, and not relying
            # on `set -e` to catch a bare failure, since this whole function
            # is called as `if auto_resolve_conflicts; then` below, and bash
            # suppresses `set -e` for a function's entire body when it's
            # called as part of an if/while condition. A process
            # substitution's exit status is also invisible to the while/read
            # loop consuming it. Either way, an unchecked `git diff` failure
            # would run the loop zero times and fall through to the closing
            # re-check below.
            conflicted_files="$(git diff --name-only --diff-filter=U)" || {
              echo "::error::failed to list conflicted files" >&2
              return 1
            }
            # The merge can fail for a reason other than a conflict, such as
            # unrelated histories. Then there is nothing to resolve.
            if [[ -z "$conflicted_files" ]]; then
              echo "::error::the merge failed but git reports no conflicted files" >&2
              return 1
            fi
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue
              # #1543: $file is an arbitrary path from the conflicting merge
              # -- an attacker who can land a commit on release/** controls
              # it (e.g. a crate directory matching `crates/*/Cargo.toml`,
              # or any path falling into the no-auto-resolution case below).
              # GitHub Actions' `::add-mask::` (used elsewhere in this job to
              # mask the token in push_with_app_token) can be bypassed by an injected
              # `::stop-commands::` sequence in log output -- strip any `::`
              # from the copy used in this loop's own echo/error lines so
              # they can never be used to smuggle one in. Git operations
              # below still use the raw, unsanitized $file.
              local file_display="${file//::/  }"
              case "$file" in
                website/docs/changelog.md)
                  echo "  $file_display: regenerating from the merged CHANGELOG-*.md sources"
                  # auto_resolve_conflicts is called as `if auto_resolve_conflicts;
                  # then ...`, and bash suppresses `set -e` for the whole body of a
                  # function called as part of an if/while condition — an
                  # unchecked failure here wouldn't abort, it would just fall
                  # through to `git add`, staging whatever sync-changelog-doc.sh
                  # left behind. Check both explicitly instead.
                  git checkout --ours -- "$file" || {
                    echo "::error::$file: git checkout --ours failed" >&2
                    return 1
                  }
                  # #1532: never run the merged working tree's copy of this
                  # script — scripts/sync-changelog-doc.sh isn't itself
                  # conflicted (only changelog.md is), so a source-branch
                  # commit that edits the script would merge in silently and
                  # then execute here with GH_TOKEN in env.
                  # Diff the source's copy against the target's own (HEAD,
                  # i.e. before this merge) instead: identical means it's
                  # safe to run the target's already-reviewed copy; any
                  # difference means the script's logic changed as part of
                  # this release and must be forward-merged and reconciled by
                  # a human, not auto-run blind.
                  local script_path="scripts/sync-changelog-doc.sh" target_script source_script tmp_script
                  target_script=$(git show "HEAD:$script_path" 2>/dev/null) || {
                    echo "::error::$file: failed to read $TARGET's copy of $script_path" >&2
                    return 1
                  }
                  source_script=$(git show "$SOURCE_REF:$script_path" 2>/dev/null) || {
                    echo "::error::$file: failed to read $SOURCE_DESC's copy of $script_path" >&2
                    return 1
                  }
                  if [[ "$target_script" != "$source_script" ]]; then
                    echo "::error::$file: $script_path differs between $SOURCE_DESC and $TARGET; a script-logic change must be forward-merged and reviewed by hand, not auto-run" >&2
                    return 1
                  fi
                  # Materialized inside scripts/ (not /tmp) so the script's
                  # own `cd "$(dirname "$0")/.."` still lands on the repo
                  # root, and written from the already-verified
                  # $target_script (not a second `git show`) so there's no
                  # gap between what was compared and what runs.
                  tmp_script=$(mktemp "$PWD/scripts/.sync-changelog-doc.XXXXXX") || {
                    echo "::error::$file: failed to create temp file for $script_path" >&2
                    return 1
                  }
                  printf '%s\n' "$target_script" > "$tmp_script" || {
                    echo "::error::$file: failed to write pinned copy of $script_path" >&2
                    rm -f "$tmp_script"
                    return 1
                  }
                  if ! bash "$tmp_script"; then
                    echo "::error::$file: scripts/sync-changelog-doc.sh failed to regenerate the changelog" >&2
                    rm -f "$tmp_script"
                    return 1
                  fi
                  rm -f "$tmp_script"
                  git add -- "$file" || {
                    echo "::error::$file: git add failed" >&2
                    return 1
                  }
                  ;;
                Cargo.lock)
                  lock_cargo=1
                  ;;
                website/package-lock.json)
                  lock_npm=1
                  ;;
                Cargo.toml | crates/*/Cargo.toml)
                  # `if manifest_keeps_target ...; then mkt_rc=0; else mkt_rc=$?; fi` (not a
                  # bare `manifest_keeps_target; mkt_rc=$?`) -- same set -e hazard noted
                  # elsewhere in this job: a bare command's exit status would kill the
                  # script under set -e before mkt_rc=$? ever ran.
                  if manifest_keeps_target "$file"; then
                    mkt_rc=0
                  else
                    mkt_rc=$?
                  fi
                  if [[ "$mkt_rc" -eq 3 ]]; then
                    echo "::error::$file_display: could not check whether keeping $TARGET's copy is safe (see log above); refusing to auto-resolve"
                    return 1
                  elif [[ "$mkt_rc" -ne 0 ]]; then
                    echo "::error::$file_display: $SOURCE_DESC changed more than version numbers here, so keeping $TARGET's copy could drop real changes"
                    return 1
                  fi
                  echo "  $file_display: keeping $TARGET's own version"
                  git checkout --ours -- "$file" || {
                    echo "::error::$file_display: git checkout --ours failed" >&2
                    return 1
                  }
                  git add -- "$file" || {
                    echo "::error::$file_display: git add failed" >&2
                    return 1
                  }
                  ;;
                *)
                  echo "::error::$file_display: conflict has no auto-resolution rule"
                  return 1
                  ;;
              esac
            done <<< "$conflicted_files"
            regenerate_lockfiles "$lock_cargo" "$lock_npm" || return 1
            # Same explicit-handler reasoning as above: this re-check must
            # not silently read as "nothing left" just because `git diff`
            # failed — `set -e` can't catch that here either.
            remaining="$(git diff --name-only --diff-filter=U)" || {
              echo "::error::failed to verify remaining conflicts" >&2
              return 1
            }
            [[ -z "$remaining" ]]
          }

          # #2504: true when every commit only on the merge branch has the cascade as
          # author and committer. A git error is not a yes: it warns and returns false.
          # Anyone who can push to the branch can forge that identity. A forged reset
          # drops only the forger's own commits, and the old tip is logged.
          branch_is_cascade_only() {
            local cascade='41898282+github-actions[bot]@users.noreply.github.com'
            local ids err err_file line
            if ! err_file=$(mktemp); then
              echo "::warning::Cannot create a temp file, so $MERGE_BRANCH is not reset"
              return 1
            fi
            if ! ids=$(git log --format='%ae %ce' "$SOURCE_REF..HEAD" "^origin/$TARGET" 2>"$err_file"); then
              err="$(<"$err_file")"
              rm -f "$err_file"
              err="${err//$'\n'/ }"
              echo "::warning::Cannot list the commits only on $MERGE_BRANCH, so it is not reset: ${err//::/  }"
              return 1
            fi
            rm -f "$err_file"
            while IFS= read -r line; do
              [[ -z "$line" || "$line" == "$cascade $cascade" ]] || return 1
            done <<< "$ids"
            return 0
          }

          for TARGET in "${TARGETS[@]}"; do
            echo "::group::Forward-merge $SOURCE_DESC → $TARGET"
            # #2280: an unreadable target ref is a failure, not an empty value.
            if ! git rev-parse --verify -q "origin/$TARGET^{commit}" >/dev/null; then
              echo "::error::cannot read origin/$TARGET; halting cascade"
              echo "::endgroup::"
              HALTED="target ref unreadable at $TARGET"
              break
            fi

            # `--is-ancestor`, not sha equality: once the chain has merged into
            # an earlier target the heads are never equal, but the target can
            # still already contain everything the source has (e.g. a human
            # resolved the merge by hand first). Merging then would add an empty
            # commit for no reason.
            # Exit 1 means "not an ancestor". Any other code means git could not
            # answer, which must not read as "merge anyway" (#2280).
            if git merge-base --is-ancestor "$SOURCE_REF" "origin/$TARGET"; then
              ANCESTOR_RC=0
            else
              ANCESTOR_RC=$?
            fi
            if [[ "$ANCESTOR_RC" -eq 0 ]]; then
              echo "Target $TARGET already contains $SOURCE_DESC"
              echo "::endgroup::"
              # #2294: the merge of this retry's PR pushed $TARGET, and the
              # push cascade from $TARGET carries the change further. Chaining
              # on here raced that cascade on the next merge branch.
              if [[ "$TARGET" == "${RETRY_TARGET:-}" ]]; then
                echo "Retry reached its own target $TARGET, which already holds $SOURCE_DESC; the push cascade from $TARGET carries it further"
                break
              fi
              # Advance the chain as a pushed merge does. Otherwise the next
              # target gets this source merged in directly, without $TARGET's
              # own commits (#2285, the fan-out that #1380 removed).
              SOURCE_REF="origin/$TARGET"
              SOURCE_DESC="$TARGET"
              continue
            elif [[ "$ANCESTOR_RC" -ne 1 ]]; then
              echo "::error::git merge-base --is-ancestor failed (exit $ANCESTOR_RC) for $SOURCE_DESC and $TARGET; halting cascade"
              echo "::endgroup::"
              HALTED="ancestry check failed at $TARGET"
              break
            fi

            # `if VAR=$(cmd); then` (not a bare `VAR=$(cmd); RC=$?`) — under
            # `set -e`, a bare assignment's exit status IS the command's, so a
            # failing command here would kill the script before RC=$? ever ran.
            if FETCH_STDERR=$(git fetch origin "$CURRENT" "$TARGET" 2>&1 >/dev/null); then
              FETCH_RC=0
            else
              FETCH_RC=$?
            fi
            if [[ $FETCH_RC -ne 0 ]]; then
              if [[ -n "$FETCH_STDERR" ]]; then
                # #2227: sanitize :: and newlines in stderr (attacker-controlled via
                # error messages from git commands on malicious servers).
                FETCH_STDERR_SAFE="${FETCH_STDERR//$'\n'/ }"
                FETCH_STDERR_SAFE="${FETCH_STDERR_SAFE//::/  }"
                echo "::warning::fetch of $CURRENT $TARGET failed: $FETCH_STDERR_SAFE"
              else
                echo "::warning::fetch of $CURRENT $TARGET failed (exit $FETCH_RC; no stderr)"
              fi
              echo "::endgroup::"
              HALTED="fetch failed for $TARGET"
              break
            fi

            git checkout -q "origin/$TARGET"

            MERGE_BRANCH="forward-merge/$SOURCE_DESC-to-$TARGET"

            # #1534: the changelog.md conflict-arm's script-integrity check
            # further down (inside auto_resolve_conflicts) only ever ran
            # when the push happened to ALSO conflict on changelog.md --
            # that arm's own entry condition. A source commit that changes
            # only scripts/sync-changelog-doc.sh (not changelog.md) produces
            # a clean, non-conflicting merge, so the gate never ran at all
            # for that push -- the script's new content landed in $TARGET
            # unverified. A later cascade that does conflict on changelog.md
            # would then compare $TARGET's already-compromised copy against
            # $SOURCE_REF's identical (attacker's) copy and pass trivially.
            # Anchor the check to $TARGET's own pre-merge copy and run it
            # for every target on every push, independent of whether this
            # merge conflicts at all. Skipped when either side lacks the
            # file (e.g. an older release line predating the script).
            SYNC_SCRIPT_PATH="scripts/sync-changelog-doc.sh"
            TARGET_HAS_SCRIPT=0
            SOURCE_HAS_SCRIPT=0
            git cat-file -e "origin/$TARGET:$SYNC_SCRIPT_PATH" 2>/dev/null && TARGET_HAS_SCRIPT=1
            git cat-file -e "$SOURCE_REF:$SYNC_SCRIPT_PATH" 2>/dev/null && SOURCE_HAS_SCRIPT=1
            # A script that exists on only ONE side (introduced or removed by
            # this push) is exactly as dangerous as one that differs on both
            # sides -- an attacker introducing scripts/sync-changelog-doc.sh
            # for the first time bypassed this whole check before this fix,
            # since the original `both sides must have it` AND-condition
            # skipped the comparison entirely for that case, letting the new
            # (unreviewed) script land in $TARGET unverified -- the same
            # #1534 bypass, just entered via introduction instead of
            # modification. Only skip when NEITHER side has it.
            if [[ "$TARGET_HAS_SCRIPT" -eq 1 || "$SOURCE_HAS_SCRIPT" -eq 1 ]]; then
              if [[ "$TARGET_HAS_SCRIPT" -ne "$SOURCE_HAS_SCRIPT" ]]; then
                echo "::error::$SYNC_SCRIPT_PATH exists on only one of $SOURCE_DESC/$TARGET; a script addition or removal must be forward-merged and reviewed by hand, not auto-run"
                echo "::endgroup::"
                HALTED="script integrity check failed at $TARGET"
                break
              fi
              # 2>/dev/null, not 2>&1 -- stderr must never fold into the value
              # used for the exact-match comparison below (incidental git
              # advice/hint output differing between the two reads could
              # otherwise produce a false "differs" verdict); only the
              # failure-handler's own message needs to say something went
              # wrong, not reproduce git's stderr text.
              SCRIPT_TARGET=$(git show "origin/$TARGET:$SYNC_SCRIPT_PATH" 2>/dev/null) || {
                echo "::error::failed to read $TARGET's copy of $SYNC_SCRIPT_PATH"
                echo "::endgroup::"
                HALTED="script read failed at $TARGET"
                break
              }
              SCRIPT_SOURCE=$(git show "$SOURCE_REF:$SYNC_SCRIPT_PATH" 2>/dev/null) || {
                echo "::error::failed to read $SOURCE_DESC's copy of $SYNC_SCRIPT_PATH"
                echo "::endgroup::"
                HALTED="script read failed at $TARGET"
                break
              }
              if [[ "$SCRIPT_TARGET" != "$SCRIPT_SOURCE" ]]; then
                echo "::error::$SYNC_SCRIPT_PATH differs between $SOURCE_DESC and $TARGET; a script-logic change must be forward-merged and reviewed by hand, not auto-run"
                echo "::endgroup::"
                HALTED="script integrity check failed at $TARGET"
                break
              fi
            fi

            # #1543 follow-up: git's own merge output (not this workflow's
            # echo lines) prints the conflicting/auto-merged path verbatim --
            # "Auto-merging <path>" and "CONFLICT (content): Merge conflict
            # in <path>" both go to STDOUT, so the earlier `2>/dev/null` here
            # left them unsanitized and unsuppressed. Verified against real
            # git: a path containing `::stop-commands::` is echoed raw by
            # git itself, before auto_resolve_conflicts' own file_display
            # sanitization ever runs. So stdout is always discarded. stderr is
            # kept only to name the cause when git refuses the merge before it
            # starts one (no MERGE_HEAD, e.g. unrelated histories), and it is
            # sanitized before it is printed (#2271).
            if ! MERGE_ERR=$(git merge --no-commit --no-ff "$SOURCE_REF" 2>&1 >/dev/null); then
              if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
                MERGE_ERR_SAFE="${MERGE_ERR//$'\n'/ }"
                echo "::error::git merge of $SOURCE_DESC into $TARGET failed with no merge in progress: ${MERGE_ERR_SAFE//::/  }"
                echo "::endgroup::"
                HALTED="merge failed at $TARGET"
                break
              fi
              echo "Conflicts; attempting auto-resolution:"
              if auto_resolve_conflicts; then
                git commit --no-edit
              else
                if ! git merge --abort; then
                  echo "::error::Failed to abort merge; working tree may be inconsistent"
                  echo "::endgroup::"
                  HALTED="merge abort failed at $TARGET"
                  break
                fi
                bail_on_conflict "$SOURCE_DESC" "$TARGET" || true
                echo "::endgroup::"
                HALTED="conflict at $TARGET"
                break
              fi
            else
              if ! git merge --abort; then
                echo "::error::Failed to abort merge; working tree may be inconsistent"
                echo "::endgroup::"
                HALTED="merge abort failed at $TARGET"
                break
              fi
              git checkout -q "origin/$TARGET"
              # Same reasoning as the trial merge above: this real merge
              # commit is only reached once the trial merge already proved
              # there's no conflict, but git still prints an "Auto-merging
              # <path>" line per three-way-merged file, unsanitized.
              if ! git merge --no-edit "$SOURCE_REF" >/dev/null 2>&1; then
                echo "::error::Failed to merge $SOURCE_DESC into $TARGET"
                echo "::endgroup::"
                HALTED="merge failed at $TARGET"
                break
              fi
            fi

            # Same set -e hazard as FETCH_RC above — a bare command's exit
            # status would kill the script before ls_rc=$? ever ran.
            if LS_STDERR=$(git ls-remote --exit-code --heads origin "$MERGE_BRANCH" 2>&1 >/dev/null); then
              ls_rc=0
            else
              ls_rc=$?
            fi
            if [[ $ls_rc -eq 0 ]]; then
              # #2220: a stale $MERGE_BRANCH used to halt the cascade
              # forever -- every commit landing on $CURRENT while that PR
              # sat open (waiting on required checks, or on a human) just
              # never propagated, silently, until someone noticed and
              # updated it by hand. Merge $SOURCE_REF onto the branch's
              # existing tip instead. This is never a force-push (#476: a
              # human may be resolving a conflict on it by hand, and
              # overwriting that would destroy their work) -- only a
              # fast-forward of whatever's already there, so an in-progress
              # manual resolution is preserved and simply gains the new
              # commits on top. Pushing new commits to an already-open PR's
              # branch updates that PR in place; no second `gh pr create`
              # needed.
              echo "$MERGE_BRANCH already exists; merging $SOURCE_DESC into it instead of halting"
              # HEAD is still the fresh merge of $SOURCE_DESC into $TARGET.
              # A reset (#2504) needs it after the checkout below moves HEAD.
              FRESH_SHA=$(git rev-parse HEAD)
              RESET_LEASE=""
              OLD_SHA=""
              DROPPED=""
              if ! git fetch origin "$MERGE_BRANCH"; then
                echo "::error::Failed to fetch existing $MERGE_BRANCH"
                echo "::endgroup::"
                HALTED="fetch of existing merge branch failed for $TARGET"
                break
              fi
              if ! git checkout -B "$MERGE_BRANCH" "origin/$MERGE_BRANCH"; then
                echo "::error::Failed to check out existing $MERGE_BRANCH"
                echo "::endgroup::"
                HALTED="checkout of existing merge branch failed for $TARGET"
                break
              fi
              # #2272: the branch can outlive its PR. delete_branch_on_merge
              # removes it only after a merge, so a PR closed without a merge
              # leaves it behind. Look for an open PR instead of assuming one.
              # stderr goes to a file, so a gh warning cannot corrupt the list.
              GH_ERR_FILE=$(mktemp)
              # Any base counts: a PR moved to another base still holds the branch, so
              # the reset below must not run under it.
              if ! OPEN_PRS_JSON=$(gh pr list --head "$MERGE_BRANCH" --state open \
                  --json number,isCrossRepository 2>"$GH_ERR_FILE"); then
                GH_ERR="$(<"$GH_ERR_FILE")"
                rm -f "$GH_ERR_FILE"
                GH_ERR="${GH_ERR//$'\n'/ }"
                echo "::error::gh pr list for $MERGE_BRANCH failed: ${GH_ERR//::/  }"
                echo "::endgroup::"
                HALTED="PR lookup failed for $TARGET"
                break
              fi
              rm -f "$GH_ERR_FILE"
              # --head matches the branch name only, so a fork PR from a branch
              # with the same name also matches. Count same-repo PRs only.
              if ! OPEN_PRS=$(jq '[.[] | select(.isCrossRepository | not)] | length' \
                  <<< "$OPEN_PRS_JSON" 2>/dev/null) || [[ ! "$OPEN_PRS" =~ ^[0-9]{1,4}$ ]]; then
                OPEN_PRS_JSON="${OPEN_PRS_JSON:0:200}"
                OPEN_PRS_JSON="${OPEN_PRS_JSON//$'\n'/ }"
                echo "::error::gh pr list for $MERGE_BRANCH returned output that is not a PR list: ${OPEN_PRS_JSON//::/  }"
                echo "::endgroup::"
                HALTED="PR lookup failed for $TARGET"
                break
              fi
              # A plain assignment, so a failure stops the step instead of
              # passing an empty SHA to approve_pending_runs.
              MERGE_SHA=$(git rev-parse HEAD)
              # #2504, #2795: with no open PR, a branch whose own commits all have the
              # cascade as author and committer holds no work to protect. Reset it to
              # the fresh merge before merging, so old cascade merges do not pile up
              # on it. Amending a commit changes its committer, so a person's edit
              # keeps the branch.
              if [[ "$OPEN_PRS" -eq 0 && "$MERGE_SHA" != "$FRESH_SHA" ]] && branch_is_cascade_only; then
                OLD_SHA="$MERGE_SHA"
                # The PR body must name what the reset drops, so a failed listing halts.
                if ! DROPPED=$(git log --format='- %h %s' "$FRESH_SHA..HEAD"); then
                  echo "::error::Cannot list the commits a reset of $MERGE_BRANCH would drop; not resetting"
                  echo "::endgroup::"
                  HALTED="reset of stale merge branch failed for $TARGET"
                  break
                fi
                if ! git checkout -B "$MERGE_BRANCH" "$FRESH_SHA"; then
                  echo "::error::Failed to reset $MERGE_BRANCH to the fresh merge"
                  echo "::endgroup::"
                  HALTED="reset of stale merge branch failed for $TARGET"
                  break
                fi
                RESET_LEASE="--force-with-lease=$MERGE_BRANCH:$OLD_SHA"
                MERGE_SHA=$(git rev-parse HEAD)
              fi
              BRANCH_CURRENT=0
              # A reset branch still needs its push, so it skips the "nothing to update"
              # check. Only exit 1 means "not an ancestor"; any other failure halts (#2280).
              if [[ -z "$RESET_LEASE" ]]; then
                if git merge-base --is-ancestor "$SOURCE_REF" HEAD; then
                  BRANCH_CURRENT=1
                else
                  ANCESTOR_RC=$?
                  if [[ $ANCESTOR_RC -ne 1 ]]; then
                    echo "::error::git merge-base failed for $MERGE_BRANCH (exit $ANCESTOR_RC)"
                    echo "::endgroup::"
                    HALTED="ancestry check failed for $MERGE_BRANCH"
                    break
                  fi
                fi
              fi
              if [[ "$BRANCH_CURRENT" -eq 1 ]]; then
                echo "$MERGE_BRANCH already contains $SOURCE_DESC; nothing to update"
                if [[ "$OPEN_PRS" -gt 0 ]]; then
                  echo "::endgroup::"
                  HELD="PR already open for $TARGET"
                  break
                fi
              fi
              if [[ "$BRANCH_CURRENT" -eq 0 ]]; then
                if ! MERGE_ERR=$(git merge --no-edit "$SOURCE_REF" 2>&1 >/dev/null); then
                  if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
                    MERGE_ERR_SAFE="${MERGE_ERR//$'\n'/ }"
                    echo "::error::git merge of $SOURCE_DESC into existing $MERGE_BRANCH failed with no merge in progress: ${MERGE_ERR_SAFE//::/  }"
                    echo "::endgroup::"
                    HALTED="merge failed updating $MERGE_BRANCH"
                    break
                  fi
                  echo "Conflicts merging $SOURCE_DESC into existing $MERGE_BRANCH; attempting auto-resolution:"
                  if auto_resolve_conflicts; then
                    git commit --no-edit
                  else
                    if ! git merge --abort; then
                      echo "::error::Failed to abort merge; working tree may be inconsistent"
                      echo "::endgroup::"
                      HALTED="merge abort failed updating $MERGE_BRANCH"
                      break
                    fi
                    bail_on_conflict "$SOURCE_DESC" "$MERGE_BRANCH" || true
                    echo "::endgroup::"
                    HALTED="conflict updating existing $MERGE_BRANCH"
                    break
                  fi
                fi
                MERGE_SHA=$(git rev-parse HEAD)
                if ! push_with_app_token origin "$MERGE_BRANCH" ${RESET_LEASE:+"$RESET_LEASE"}; then
                  echo "::error::Push to update existing merge branch $MERGE_BRANCH failed"
                  if [[ -n "$RESET_LEASE" ]]; then
                    echo "::error::The push held a lease on old tip $OLD_SHA, so $MERGE_BRANCH was not reset. Someone may have pushed to it after this run fetched it."
                  fi
                  echo "::endgroup::"
                  HALTED="merge-branch update push failed for $TARGET"
                  break
                fi
                if [[ -n "$RESET_LEASE" ]]; then
                  echo "::warning::Reset stale $MERGE_BRANCH (old tip $OLD_SHA): no open PR, and only the cascade wrote its commits. Restore it with: git push --force-with-lease=$MERGE_BRANCH:$MERGE_SHA origin $OLD_SHA:refs/heads/$MERGE_BRANCH"
                fi
                # With no open PR, no run exists yet to approve.
                if [[ "$OPEN_PRS" -gt 0 ]]; then
                  approve_pending_runs "$MERGE_SHA" "$MERGE_BRANCH"
                fi
              fi
              if [[ "$OPEN_PRS" -eq 0 ]]; then
                echo "No open PR exists for $MERGE_BRANCH; opening one on the existing branch."
                # The branch can hold commits from an earlier PR that a reviewer
                # closed on purpose, so the new PR lists them for review.
                BRANCH_OWN=$(git log --no-merges --format='- %h %s' "$SOURCE_REF..HEAD" "^origin/$TARGET") \
                  || BRANCH_OWN="- (the cascade could not list them)"
                PR_BODY="No open PR existed for $MERGE_BRANCH, so the cascade updated the existing branch and opened this PR."
                if [[ -n "$RESET_LEASE" ]]; then
                  PR_BODY+=$'\n\n'"No open PR held this branch and only the cascade had written its commits, so the cascade reset it to a fresh merge of $SOURCE_DESC. Old tip: $OLD_SHA"$'\n'"Dropped commits:"$'\n'"$DROPPED"
                fi
                if [[ -n "$BRANCH_OWN" ]]; then
                  PR_BODY+=$'\n\n'"The branch also holds these commits, which are not on $SOURCE_DESC or $TARGET. An earlier PR for this branch may have carried them. Review them before you merge:"$'\n'"$BRANCH_OWN"
                fi
                if ! GH_TOKEN="${_app_token:-}" gh pr create --base "$TARGET" --head "$MERGE_BRANCH" \
                  --title "Forward-merge $SOURCE_DESC into $TARGET" --body "$PR_BODY"; then
                  echo "::error::Failed to create PR for $MERGE_BRANCH"
                  HALTED="PR creation failed for $TARGET"
                else
                  echo "::notice::Opened PR for $TARGET on the existing $MERGE_BRANCH; the cascade resumes when it merges"
                  enable_auto_merge "$MERGE_BRANCH"
                  approve_pending_runs "$MERGE_SHA" "$MERGE_BRANCH"
                  HELD="PR opened for $TARGET"
                fi
                echo "::endgroup::"
                break
              fi
              echo "::notice::Updated the open PR for $TARGET with $SOURCE_DESC"
              echo "::endgroup::"
              HELD="PR already open for $TARGET (branch updated with $SOURCE_DESC)"
              break
            elif [[ $ls_rc -ne 2 ]]; then
              # Exit 2 means "no such branch". Any other code (auth, network,
              # bad remote) is a failure; git's own stderr names which one.
              if [[ -n "$LS_STDERR" ]]; then
                LS_STDERR_SAFE="${LS_STDERR//$'\n'/ }"
                echo "::error::ls-remote for $MERGE_BRANCH failed (exit $ls_rc): ${LS_STDERR_SAFE//::/  }"
              else
                echo "::error::ls-remote for $MERGE_BRANCH failed (exit $ls_rc; no stderr)"
              fi
              echo "::endgroup::"
              HALTED="ls-remote failed at $TARGET"
              break
            fi

            # Create the branch at HEAD (the merge commit made above), not at
            # origin/$TARGET, which would discard the merge commit.
            if ! git checkout -B "$MERGE_BRANCH"; then
              echo "::error::Failed to create merge branch $MERGE_BRANCH"
              echo "::endgroup::"
              HALTED="checkout failed at $TARGET"
              break
            fi
            MERGE_SHA=$(git rev-parse HEAD)
            # ls-remote found no such branch, so the lease only fails if a
            # person created it since then.
            if ! push_with_app_token origin "$MERGE_BRANCH" --force-with-lease; then
              echo "::error::Push to merge branch $MERGE_BRANCH failed; cannot open PR"
              echo "::endgroup::"
              HALTED="merge-branch push failed for $TARGET"
              break
            fi

            PR_BODY="The cascade merged $SOURCE_DESC into $TARGET on this branch. Auto-merge lands it once the required checks pass, and the cascade then resumes from $SOURCE_DESC."
            if ! GH_TOKEN="${_app_token:-}" gh pr create --base "$TARGET" --head "$MERGE_BRANCH" \
              --title "Forward-merge $SOURCE_DESC into $TARGET" \
              --body "$PR_BODY"; then
              echo "::error::Failed to create PR for $MERGE_BRANCH"
              HALTED="PR creation failed for $TARGET"
            else
              echo "::notice::Opened PR for $TARGET; the cascade resumes when it merges"
              enable_auto_merge "$MERGE_BRANCH"
              approve_pending_runs "$MERGE_SHA" "$MERGE_BRANCH"
              HELD="PR opened for $TARGET"
            fi
            echo "::endgroup::"
            break
          done

          finish_cascade
