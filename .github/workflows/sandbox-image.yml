name: sandbox-image

# Builds and publishes llmenv's minimal default sandbox image (#1653,
# docs/design/issue-1080-sidecar-container.md). Triggered on a push to a
# protected branch that touches the image definition, or manually — never on
# `pull_request`, so an untrusted PR never gets GHCR push credentials.
on:
  push:
    branches: [main, 'release/*']
    paths:
      - 'docker/sandbox/**'
      - '.github/workflows/sandbox-image.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/llmenv-sandbox

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: read image version
        id: version
        run: |
          raw="$(cat docker/sandbox/VERSION)"
          if [[ ! "$raw" =~ ^[0-9]+$ ]]; then
            echo "docker/sandbox/VERSION must be a single integer, got: $raw" >&2
            exit 1
          fi
          echo "version=v$raw" >> "$GITHUB_OUTPUT"

  # Builds each platform separately and pushes it to GHCR by digest only —
  # no `vN`/`sha-<short>` tag, so it isn't what `docker pull
  # ghcr.io/.../llmenv-sandbox:vN` resolves to and isn't listed as a
  # version in GHCR's UI (#1732). Trivy scans that per-platform digest
  # directly, so both linux/amd64 and linux/arm64 are actually scanned —
  # today only the runner's own platform is (#1732). This job holds no
  # `id-token`/`attestations` permission (#1733); the `publish` job below,
  # which needs those to sign and attest, only runs once every matrix leg
  # here has passed its scan.
  build-scan:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
          - platform: linux/arm64
            slug: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tags: drives only the OCI labels below (org.opencontainers.image.version
      # etc.) — push-by-digest ignores steps.meta.outputs.tags, so this never
      # publishes a release tag. Without it, metadata-action falls back to a
      # branch-ref-derived version and every layer gets a wrong version label.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}

      # push-by-digest: pushes this platform's image so Trivy can scan the
      # exact published bytes, but under no release tag (see job comment).
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        id: build
        with:
          context: docker/sandbox
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # Fails the workflow on a HIGH/CRITICAL finding (#1721) before the
      # `publish` job can merge this digest into a released tag. Only a
      # reviewed docker/sandbox/.trivyignore entry suppresses a specific
      # finding; ignore-unfixed stays false so an unfixed CVE still fails
      # the build and forces a deliberate, documented suppression instead
      # of a blanket drop.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: docker/sandbox/.trivyignore

      # A failed scan leaves the digest-only blob `build-push-action` already
      # pushed sitting in GHCR forever (#1757) — it carries no tag, SBOM,
      # attestation, or signature, so nothing discovers it by tag, but it is
      # a real registry artifact. GHCR's delete API takes a numeric package-
      # version id, not a digest, so list versions and filter to the one
      # matching this digest before deleting — never delete on a guess.
      - name: delete unscanned digest from GHCR on scan failure
        if: failure() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail

          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::cleanup step got no usable digest to look up (got: '${DIGEST}')" >&2
            exit 1
          fi

          # /users/ and /orgs/ are different API paths for the same package-
          # versions resource — pick the one that matches this repo's actual
          # owner instead of assuming a user account.
          owner_type="$(gh api "/users/${OWNER}" --jq .type)"
          if [[ "$owner_type" == "Organization" ]]; then
            scope="orgs"
          else
            scope="users"
          fi

          # The GHCR container-versions API paginates; --paginate walks every
          # page and concatenates each page's JSON array, so slurp them back
          # into one array before filtering by digest.
          version_id="$(gh api --paginate "/${scope}/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100" \
            | jq -s 'add' \
            | jq -r --arg d "$DIGEST" '.[] | select(.name == $d) | .id' \
            | head -1)"

          if [[ -z "$version_id" ]]; then
            echo "::warning::No GHCR package version found for digest ${DIGEST} — nothing to clean up."
            exit 0
          fi

          echo "Deleting unscanned GHCR package version ${version_id} (digest ${DIGEST})"
          if delete_err="$(gh api -X DELETE "/${scope}/${OWNER}/packages/container/${PACKAGE}/versions/${version_id}" 2>&1 >/dev/null)"; then
            echo "Deleted GHCR package version ${version_id}."
          elif [[ "$delete_err" == *404* ]]; then
            # Already gone by the time we got here (a concurrent cleanup run,
            # GHCR's own retention) — not a real failure, so don't fail the step.
            echo "::warning::GHCR package version ${version_id} was already gone by delete time (digest ${DIGEST})."
          else
            echo "::error::failed to delete unscanned GHCR package version ${version_id} (digest ${DIGEST}): ${delete_err}" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: llmenv-sandbox
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: export digest
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build step produced no usable digest (got: '${DIGEST}')" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Only runs once every build-scan matrix leg has passed its Trivy scan.
  # Merges the already-scanned per-platform digests into the release tags
  # with no rebuild, then attests, SBOMs, and signs the merged image — the
  # same as `build-and-publish` did before, just retargeted to the merged
  # digest instead of build-push-action's single-step output.
  publish:
    needs: [version, build-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by actions/attest-build-provenance: `id-token` to get the
      # OIDC token Sigstore signs against, `attestations` to store the result
      # — same pattern release.yml already uses for the binary artifacts.
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short

      # Reads the merged index's digest straight from `imagetools create`'s own
      # --metadata-file output, not a follow-up `imagetools inspect` of the
      # :VERSION tag — inspecting the tag instead would race a concurrent
      # workflow run that repoints it between the create and the inspect,
      # and could attest/sign a different image than the one just scanned.
      - name: merge digests into release tags
        id: merge
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tag_args+=(-t "$tag")
          done <<< "$META_TAGS"
          if [[ ${#tag_args[@]} -eq 0 ]]; then
            echo "::error::No tags parsed from docker/metadata-action output — refusing to publish an untagged image." >&2
            exit 1
          fi

          # Must match the number of platforms in build-scan's matrix above.
          expected_digests=2
          digest_refs=()
          for digest_file in *; do
            digest_hex="$(basename "$digest_file")"
            if [[ ! "$digest_hex" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Unexpected file in digest artifact directory: '${digest_hex}'" >&2
              exit 1
            fi
            digest_refs+=("${IMAGE_NAME}@sha256:${digest_hex}")
          done
          if [[ ${#digest_refs[@]} -ne "$expected_digests" ]]; then
            echo "::error::Expected ${expected_digests} platform digests, found ${#digest_refs[@]}." >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" --metadata-file metadata.json "${digest_refs[@]}"
          digest="$(jq -r '.["containerimage.descriptor"].digest' metadata.json)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::imagetools create produced no usable digest (got: '${digest}')" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          META_TAGS: ${{ steps.meta.outputs.tags }}

      # Generates the SBOM the next step attaches to the published image
      # (#1722), from the merged multi-arch image now published in GHCR.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.merge.outputs.digest }}
          format: spdx-json
          output-file: sandbox-image.spdx.json
          upload-artifact: false

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          sbom-path: sandbox-image.spdx.json
          push-to-registry: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      # Keyless signing (#1723): cosign uses the job's own OIDC token
      # (`id-token: write`, above) to sign against Sigstore's Fulcio/Rekor —
      # no key material to manage or leak. Lets a consumer verify the image's
      # origin independent of the build-provenance/SBOM attestations above,
      # the way release notes already document `slsa-verifier` for release
      # binaries (#1412); see website/docs/commands.md's Sandbox section for
      # the verify command.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: sign the published image
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.merge.outputs.digest }}
