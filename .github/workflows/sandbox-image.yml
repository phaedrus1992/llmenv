name: sandbox-image

# Builds and publishes llmenv's minimal default sandbox image (#1653,
# docs/design/issue-1080-sidecar-container.md). Triggered on a push to a
# protected branch that touches the image definition, or manually — never on
# `pull_request`, so an untrusted PR never gets GHCR push credentials.
on:
  push:
    branches: [main, 'release/*']
    paths:
      - 'docker/sandbox/**'
      - '.github/workflows/sandbox-image.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/llmenv-sandbox

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by actions/attest-build-provenance: `id-token` to get the
      # OIDC token Sigstore signs against, `attestations` to store the result
      # — same pattern release.yml already uses for the binary artifacts.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: read image version
        id: version
        run: |
          raw="$(cat docker/sandbox/VERSION)"
          if [[ ! "$raw" =~ ^[0-9]+$ ]]; then
            echo "docker/sandbox/VERSION must be a single integer, got: $raw" >&2
            exit 1
          fi
          echo "version=v$raw" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        id: build
        with:
          context: docker/sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Fails the workflow on a HIGH/CRITICAL finding (#1721) before the image
      # is signed or attested — a vulnerable image shouldn't get either. Only
      # a reviewed docker/sandbox/.trivyignore entry suppresses a specific
      # finding; ignore-unfixed stays false so an unfixed CVE still fails the
      # build and forces a deliberate, documented suppression instead of a
      # blanket drop.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: docker/sandbox/.trivyignore

      # Generates the SBOM the next step attaches to the published image
      # (#1722). Reads the just-pushed image straight from GHCR via the
      # credentials docker/login-action already set up, by digest so it's the
      # exact multi-arch manifest build-push-action just published.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sandbox-image.spdx.json
          upload-artifact: false

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sandbox-image.spdx.json
          push-to-registry: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Keyless signing (#1723): cosign uses the job's own OIDC token
      # (`id-token: write`, above) to sign against Sigstore's Fulcio/Rekor —
      # no key material to manage or leak. Lets a consumer verify the image's
      # origin independent of the build-provenance/SBOM attestations above,
      # the way release notes already document `slsa-verifier` for release
      # binaries (#1412); see website/docs/commands.md's Sandbox section for
      # the verify command.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: sign the published image
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
