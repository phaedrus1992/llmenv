name: opencode-js

on:
  pull_request:
    paths:
      - 'src/adapter/opencode/**'
      - 'scripts/opencode-js-test.sh'
      - '.github/workflows/opencode-js.yml'

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: src/adapter/opencode/js-test/package-lock.json
      - run: scripts/opencode-js-test.sh --coverage
