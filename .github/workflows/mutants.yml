name: mutants
# Mutation testing (#1233): coverage says a line ran, this says a test would
# have noticed if it behaved differently.
#
# Deliberately not part of the `ci` workflow. Each mutant costs a rebuild plus a
# full test run (~150s measured), so the scoped set in .cargo/mutants.toml is
# ~30h serially — far too slow to gate a PR on. Instead:
#
#   in-diff  — PRs only test mutants on lines the PR actually changed, which is
#              usually a handful, and fails if any survive.
#   sweep    — the full scoped set, sharded, weekly. Report-only: the backlog is
#              not clean yet, so failing here would just be permanently red.
on:
  pull_request:
    paths:
      - 'crates/llmenv-config/src/**'
      - 'src/merge/**'
      - 'src/hook_run/**'
      - '.cargo/mutants.toml'
      - '.github/workflows/mutants.yml'
  schedule:
    # Mondays 04:00 UTC — off-peak, and a week is long enough that the sweep's
    # cost is amortized rather than blocking anyone.
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  # Serialize rustup's component writes; parallel installs trip the runner's
  # virtualized disk (os error 5, #553). Inert for steps that don't call rustup.
  RUSTUP_IO_THREADS: "1"
jobs:
  in-diff:
    # Sharded because the budget is per-mutant, not per-PR: cargo-mutants runs a
    # full build+test for each one (~100s here), so a PR touching ~25 mutable
    # lines exceeds a single runner's 45 minutes and the job is killed mid-run —
    # which reads as a CI failure while telling you nothing about the code. Four
    # shards keep wall-clock roughly constant as diffs grow.
    name: mutants (changed lines, shard ${{ matrix.shard }}/4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # cargo-mutants shards are zero-indexed — `k/n` requires k < n, so the
        # last shard is 3/4, not 4/4. A 1-based list fails that shard outright
        # (`shard k must be less than n`) rather than mis-splitting the work.
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # --in-diff needs the base commit present to diff against.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-mutants@27.1.0
      - name: Detect CPU count
        run: echo "CARGO_BUILD_JOBS=$(scripts/core_count.sh)" >> "$GITHUB_ENV"
      - name: Diff against the merge base
        # `base_ref` goes through the environment, not string interpolation — a
        # branch name is attacker-controllable and would otherwise be pasted
        # straight into the shell.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/${BASE_REF}"...HEAD > mutants-pr.diff
          wc -l mutants-pr.diff
          # A PR that touches no Rust has nothing to mutate, and cargo-mutants
          # exits non-zero on an empty set rather than treating it as "nothing
          # to do" — which turns a docs- or workflow-only PR into a red build.
          if git diff --name-only "origin/${BASE_REF}"...HEAD | grep -q '\.rs$'; then
            echo "HAS_RUST=1" >> "$GITHUB_ENV"
          else
            echo "no Rust changed; skipping mutation testing"
            echo "HAS_RUST=0" >> "$GITHUB_ENV"
          fi
      # Surviving mutants on lines this PR touched are the actionable case: the
      # PR added or changed logic no test distinguishes from a wrong version.
      - if: env.HAS_RUST == '1'
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo mutants --workspace --in-diff mutants-pr.diff --shard "${SHARD}"/4
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && env.HAS_RUST == '1'
        with:
          name: mutants-in-diff-${{ matrix.shard }}
          path: mutants.out/

  sweep:
    name: mutants (full sweep, shard ${{ matrix.shard }}/8)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Report-only, see the header: the scoped backlog has never been triaged, so
    # a failing sweep would be red on day one and stay red.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Zero-indexed, as above. This list was 1-8, so shard 8/8 failed on
        # every weekly run — invisible because the sweep is report-only, and
        # one eighth of the backlog therefore went untested.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-mutants@27.1.0
      - name: Detect CPU count
        run: echo "CARGO_BUILD_JOBS=$(scripts/core_count.sh)" >> "$GITHUB_ENV"
      - env:
          SHARD: ${{ matrix.shard }}
        run: cargo mutants --workspace --shard "${SHARD}"/8
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: mutants-sweep-${{ matrix.shard }}
          path: mutants.out/
